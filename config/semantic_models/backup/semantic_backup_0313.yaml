    # ── Facts ────────────────────────────────────────────────────────────────
    facts:
      - name: BOUNCES
        synonyms:
          - BOUNCE_RAW_COUNT
          - BOUNCES_RAW
          - RAW_BOUNCES
        description: >
          The total number of bounced emails (undeliverable).
        expr: BOUNCES
        data_type: NUMBER(38,0)
        access_modifier: public_access
        sample_values:
          - "0"
          - "975"
          - "10"

      - name: CLICKS
        synonyms:
          - CLICKS_RAW
          - GROSS_CLICKS_RAW
          - RAW_CLICKS
        description: >
          The total number of clicks on links within the email (including multiple clicks by same recipient).
          NOT used for rate calculations - use UNIQUE_CLICKS instead for CTR/CTOR.
        expr: CLICKS
        data_type: NUMBER(38,0)
        access_modifier: public_access

      - name: OPENS
        synonyms:
          - GROSS_OPENS_RAW
          - OPENS_RAW
          - RAW_OPENS
        description: >
          The total number of email opens (including multiple opens by same recipient).
          NOT used for rate calculations - use UNIQUE_OPENS instead for open rate.
          Note: May include tracking pixel loads, not always actual reads.
        expr: OPENS
        data_type: NUMBER(38,0)
        access_modifier: public_access
        sample_values:
          - "1"
          - "4"
          - "2"

      - name: SENDS
        synonyms:
          - DELIVERY_ATTEMPTS
          - RAW_SENDS
          - SENDS_RAW
        description: >
          The total number of email delivery attempts.
          This is NOT successful deliveries - use (SENDS - BOUNCES) for delivered emails.
          Base metric for calculating bounce rate and unsubscribe rate.
        expr: SENDS
        data_type: NUMBER(38,0)
        access_modifier: public_access
        sample_values:
          - "5"
          - "3"
          - "2"

      - name: UNIQUE_CLICKS
        synonyms:
          - RAW_UNIQUE_CLICKS
          - UNIQUE_CLICKS_RAW
        description: >
          The count of unique recipients who clicked (deduplicated).
          PRIMARY METRIC for click rate calculations:
          - CTR (click_rate) = UNIQUE_CLICKS / DELIVERED
          - CTOR (click_to_open_rate) = UNIQUE_CLICKS / UNIQUE_OPENS
        expr: UNIQUE_CLICKS
        data_type: NUMBER(38,0)
        access_modifier: public_access
        sample_values:
          - "1"
          - "31"
          - "2"

      - name: UNIQUE_OPENS
        synonyms:
          - RAW_UNIQUE_OPENS
          - UNIQUE_OPENS_RAW
        description: >
          The count of unique recipients who opened the email (deduplicated).
          PRIMARY METRIC for open rate calculations: open_rate = UNIQUE_OPENS / DELIVERED.
          More accurate measure of reach than total opens.
          Synonyms: unique open count, distinct opens, individual opens.
        expr: UNIQUE_OPENS
        data_type: NUMBER(38,0)
        access_modifier: public_access
        sample_values:
          - "0"
          - "3"
          - "5"

      - name: UNSUBSCRIBES
        synonyms:
          - RAW_UNSUBSCRIBES
          - UNSUBS_RAW
          - UNSUBSCRIBES_RAW
        description: >
          The total number of recipients who opted out/unsubscribed.
          Key indicator of email fatigue and content relevance.
        expr: UNSUBSCRIBES
        data_type: NUMBER(38,0)
        access_modifier: public_access
        sample_values:
          - "0"
          - "127"
          - "1"

    # ── Filters ────────────────────────────────────────────────────────────────
    filters:
      - name: last_12_months
        description: >
          The 12 most recent COMPLETE calendar months. Use when user asks about "last 12 months", "past year", "trailing twelve months", "TTM".
        expr: SEND_DATE >= DATE_TRUNC('MONTH', DATEADD('MONTH', -12, CURRENT_DATE)) AND SEND_DATE < DATE_TRUNC('MONTH', CURRENT_DATE)

      - name: last_2_quarters
        description: >
          The 2 most recent COMPLETE quarters. Example: If today is Jan 15, 2025, returns Q3-Q4 2024. Use when user asks about "last 2 quarters", "past 2 quarters".
        expr: SEND_DATE >= DATE_TRUNC('QUARTER', DATEADD('QUARTER', -2, CURRENT_DATE)) AND SEND_DATE < DATE_TRUNC('QUARTER', CURRENT_DATE)

      - name: last_3_months
        description: >
          The 3 most recent COMPLETE calendar months. Example: If today is Jan 15, 2025, returns Oct-Dec 2024. Use when user asks about "last 3 months", "past 3 months", "previous 3 months".
        expr: SEND_DATE >= DATE_TRUNC('MONTH', DATEADD('MONTH', -3, CURRENT_DATE)) AND SEND_DATE < DATE_TRUNC('MONTH', CURRENT_DATE)

      - name: last_6_months
        description: >
          The 6 most recent COMPLETE calendar months. Example: If today is Jan 15, 2025, returns Jul-Dec 2024. Use when user asks about "last 6 months", "past 6 months", "last half year".
        expr: SEND_DATE >= DATE_TRUNC('MONTH', DATEADD('MONTH', -6, CURRENT_DATE)) AND SEND_DATE < DATE_TRUNC('MONTH', CURRENT_DATE)

      - name: last_month
        description: >
          The most recent COMPLETE calendar month. Example: If today is Jan 15, 2025, returns Dec 1-31, 2024. Use when user asks about "last month", "previous month", "prior month".
        expr: SEND_DATE >= DATE_TRUNC('MONTH', DATEADD('MONTH', -1, CURRENT_DATE)) AND SEND_DATE < DATE_TRUNC('MONTH', CURRENT_DATE)

      - name: last_quarter
        description: >
          The most recent COMPLETE quarter. Example: If today is Jan 15, 2025, returns Q4 2024 (Oct-Dec). Use when user asks about "last quarter", "previous quarter", "prior quarter", "last Q".
        expr: SEND_DATE >= DATE_TRUNC('QUARTER', DATEADD('QUARTER', -1, CURRENT_DATE)) AND SEND_DATE < DATE_TRUNC('QUARTER', CURRENT_DATE)

      - name: last_rolling_30_days
        description: >
          Rolling 30-day period from today. Note: This is rolling, not complete calendar months. Use when user specifically asks about "last 30 days", "past 30 days".
        expr: SEND_DATE >= DATEADD('DAY', -30, CURRENT_DATE) AND SEND_DATE <= CURRENT_DATE

      - name: last_rolling_90_days
        description: >
          Rolling 90-day period from today. Note: This is rolling, not complete calendar quarters. Use when user specifically asks about "last 90 days", "past 90 days".
        expr: SEND_DATE >= DATEADD('DAY', -90, CURRENT_DATE) AND SEND_DATE <= CURRENT_DATE

      - name: last_week
        description: >
          The most recent COMPLETE week (Monday-Sunday). Use when user asks about "last week", "previous week".
        expr: SEND_DATE >= DATE_TRUNC('WEEK', DATEADD('WEEK', -1, CURRENT_DATE)) AND SEND_DATE < DATE_TRUNC('WEEK', CURRENT_DATE)

      - name: last_week_sends
        description: >
          Filters for email campaigns sent during the previous complete week (Monday to Sunday). Use when questions ask about 'last week performance', 'previous week results', 'week-over-week comparison', 'recent weekly activity', or 'last week's campaigns'. Helps analyze recent email performance trends and weekly campaign effectiveness.
        expr: SEND_DATE < DATE_TRUNC('WEEK', CURRENT_DATE) AND SEND_DATE >= DATE_TRUNC('WEEK', DATEADD(WEEK, -1, CURRENT_DATE))

      - name: last_year
        description: >
          The most recent COMPLETE calendar year. Example: If today is Jan 15, 2025, returns full year 2024. Use when user asks about "last year", "previous year", "prior year".
        expr: SEND_DATE >= DATE_TRUNC('YEAR', DATEADD('YEAR', -1, CURRENT_DATE)) AND SEND_DATE < DATE_TRUNC('YEAR', CURRENT_DATE)

      - name: minimum_viable_campaigns
        description: >
          Filters for campaigns with more than 50 total sends, including smaller but still meaningful campaign volumes. Use when questions ask about 'all meaningful campaigns', 'including smaller campaigns', 'comprehensive campaign analysis', or when including lower-volume but significant sends. Helps ensure analysis includes campaigns with sufficient volume for basic performance assessment.
        expr: SUM(SENDS) > 50

      - name: this_month
        description: >
          Current incomplete month (from 1st to today). Use when user asks about "this month", "current month", "month to date", "MTD".
        expr: SEND_DATE >= DATE_TRUNC('MONTH', CURRENT_DATE) AND SEND_DATE <= CURRENT_DATE

      - name: this_quarter
        description: >
          Current incomplete quarter (from quarter start to today). Use when user asks about "this quarter", "current quarter", "quarter to date", "QTD".
        expr: SEND_DATE >= DATE_TRUNC('QUARTER', CURRENT_DATE) AND SEND_DATE <= CURRENT_DATE

      - name: this_year
        description: >
          Current incomplete year (from Jan 1 to today). Use when user asks about "this year", "current year", "year to date", "YTD".
        expr: SEND_DATE >= DATE_TRUNC('YEAR', CURRENT_DATE) AND SEND_DATE <= CURRENT_DATE

    # ── Metrics ────────────────────────────────────────────────────────────────
    metrics:
      - name: BOUNCE_RATE
        description: >
          Percentage of emails that bounced (undeliverable). Formula: (bounces / sends) * 100.
        expr: ROUND(SUM(BOUNCES) / NULLIF(SUM(SENDS), 0), 3)
        access_modifier: public_access

      - name: BOUNCE_RATE_PCT
        description: >
          Calculates the percentage of emails that bounced (undeliverable), rounded to 1 decimal (e.g., 1.5%).
          Formula: (bounces / sends) * 100.
        expr: ROUND(100.0 * SUM(BOUNCES) / NULLIF(SUM(SENDS), 0), 1)
        access_modifier: public_access

      - name: CLICK_RATE
        description: >
          Percentage of unique clicks out of delivered emails (Click-Through Rate / CTR).
          Formula: (unique_clicks / delivered) * 100, where delivered = sends - bounces. Use for questions about 'click rate', 'CTR', 'click-through rate'.
        expr: ROUND(SUM(UNIQUE_CLICKS) / NULLIF(SUM(SENDS) - SUM(BOUNCES), 0), 3)
        access_modifier: public_access

      - name: CLICK_RATE_PCT
        description: >
          Calculates the percentage of unique clicks out of delivered emails (CTR), rounded to 1 decimal (e.g., 2.5%).
          PRIMARY ENGAGEMENT METRIC, Formula: (unique_clicks / delivered) * 100.
          Use when questions ask about 'click rate', 'CTR', 'click-through rate', or 'email engagement'.
        expr: ROUND(100.0 * SUM(UNIQUE_CLICKS) / NULLIF(SUM(SENDS) - SUM(BOUNCES), 0), 1)
        access_modifier: public_access

      - name: CLICK_TO_OPEN_RATE
        description: >
          Percentage of unique opens that resulted in unique clicks (CTOR). Formula: (unique_clicks / unique_opens) * 100.
          Not reliable due to Apple MPP impact on open rates. Measures content effectiveness for those who opened.
        expr: ROUND(SUM(UNIQUE_CLICKS) / NULLIF(SUM(UNIQUE_OPENS), 0), 3)
        access_modifier: public_access

      - name: CLICK_TO_OPEN_RATE_PCT
        description: >
          Calculates the percentage of unique opens that resulted in unique clicks (CTOR), rounded to 1 decimal (e.g., 15.2%).
          Not reliable due to Apple MPP. Formula: (unique_clicks / unique_opens) * 100.
        expr: ROUND(100.0 * SUM(UNIQUE_CLICKS) / NULLIF(SUM(UNIQUE_OPENS), 0), 1)
        access_modifier: public_access

      - name: OPEN_RATE
        description: >
          Percentage of unique opens out of delivered emails. Formula: (unique_opens / delivered) * 100, where delivered = sends - bounces.
          Not reliable due to Apple MPP. Use for questions about 'open rate', 'email open percentage', 'open ratio'.
        expr: ROUND(SUM(UNIQUE_OPENS) / NULLIF(SUM(SENDS) - SUM(BOUNCES), 0), 3)
        access_modifier: public_access

      - name: OPEN_RATE_PCT
        description: >
          Calculates the percentage of unique opens out of delivered emails, rounded to 1 decimal (e.g., 22.5%).
          Not reliable due to Apple MPP. Formula: (unique_opens / delivered) * 100.
          Use when questions ask about 'open rate', 'email open percentage', 'open ratio', or 'email reach'.
        expr: ROUND(100.0 * SUM(UNIQUE_OPENS) / NULLIF(SUM(SENDS) - SUM(BOUNCES), 0), 1)
        access_modifier: public_access

      - name: TOTAL_BOUNCES
        description: >
          Total number of bounced emails (undeliverable). Monitor for list health assessment.
          Use when questions ask about 'total bounces', 'bounced emails', 'failed deliveries', 'undelivered emails', or 'delivery failures'.
        expr: SUM(BOUNCES)
        access_modifier: public_access

      - name: TOTAL_CLICKS
        description: >
          Total number of clicks on email links. Includes multiple clicks by the same recipient (gross clicks).
          Measures overall engagement with email content.
          Use when questions ask about 'total clicks', 'all clicks', 'gross clicks', or 'click count'.
        expr: SUM(CLICKS)
        access_modifier: public_access

      - name: TOTAL_DELIVERED
        description: >
          Total number of delivered emails. Calculated as sends minus bounces.
          Use when questions ask about 'total delivered', 'successful deliveries', 'emails delivered', or 'delivery count'.
        expr: SUM(SENDS) - SUM(BOUNCES)
        access_modifier: public_access

      - name: TOTAL_OPENS
        description: >
          Total number of email opens across all recipients. Includes multiple opens by the same recipient (gross opens).
          Use when questions ask about 'total opens', 'all opens', 'gross opens', or 'open count'.
        expr: SUM(OPENS)
        access_modifier: public_access

      - name: TOTAL_SENDS
        description: >
          Total number of email opens across all recipients. Includes multiple opens by the same recipient (gross opens).
          Use when questions ask about 'total opens', 'all opens', 'gross opens', or 'open count'.
        expr: SUM(SENDS)
        access_modifier: public_access

      - name: TOTAL_UNIQUE_CLICKS
        description: >
          Total unique recipients who clicked (deduplicated count). More accurate for measuring engagement than total clicks.
          Use when questions ask about 'unique clicks', 'distinct clicks', 'individual clicks', or 'net clicks'.
        expr: SUM(UNIQUE_CLICKS)
        access_modifier: public_access

      - name: TOTAL_UNIQUE_OPENS
        description: >
          Total unique recipients who opened emails (deduplicated count). More accurate for measuring reach than total opens.
          Use when questions ask about 'unique opens', 'distinct opens', 'individual opens', or 'net opens'.
        expr: SUM(UNIQUE_OPENS)
        access_modifier: public_access

      - name: TOTAL_UNSUBSCRIBES
        description: >
          Total number of opt-outs/unsubscribes from email list.
          Use when questions ask about 'total unsubscribes', 'opt-outs', 'unsubscribe count', or 'churn count'.
          Monitor for email fatigue and content relevance.
        expr: SUM(UNSUBSCRIBES)
        access_modifier: public_access

      - name: UNIQUE_CLICK_RATE
        description: >
          Percentage of unique recipients who clicked out of delivered emails.
          Formula: (unique_clicks / delivered) * 100, where delivered = sends - bounces.
          Same calculation as CLICK_RATE - kept for compatibility and clarity.
        expr: ROUND(SUM(UNIQUE_CLICKS) / NULLIF(SUM(SENDS) - SUM(BOUNCES), 0), 3)
        access_modifier: public_access

      - name: UNIQUE_OPEN_RATE
        description: >
          Percentage of unique recipients who opened out of delivered emails.
          Formula: (unique_opens / delivered) * 100, where delivered = sends - bounces.
          Same calculation as OPEN_RATE - kept for compatibility and clarity.
        expr: ROUND(SUM(UNIQUE_OPENS) / NULLIF(SUM(SENDS) - SUM(BOUNCES), 0), 3)
        access_modifier: public_access

      - name: UNSUBSCRIBE_RATE
        description: >
          Percentage of recipients who opted out/unsubscribed. Formula: (unsubscribes / sends) * 100.
        expr: ROUND(SUM(UNSUBSCRIBES) / NULLIF(SUM(SENDS), 0), 3)
        access_modifier: public_access

      - name: UNSUBSCRIBE_RATE_PCT
        description: >
          Calculates the percentage of recipients who opted out/unsubscribed, rounded to 1 decimal (e.g., 0.3%).
          Formula: (unsubscribes / sends) * 100.
        expr: ROUND(100.0 * SUM(UNSUBSCRIBES) / NULLIF(SUM(SENDS), 0), 1)
        access_modifier: public_access


