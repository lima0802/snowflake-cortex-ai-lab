# ──Instructions ────────────────────────────────────────────────────────────────
custom_instructions:

  # -----------------------------------------------------------------------------
  # AI_SQL_GENERATION
  # -----------------------------------------------------------------------------

  ai_sql_generation: |
    When generating SQL for this semantic view, apply the following rules:

    MANDATORY GLOBAL FILTER:
    - ALWAYS exclude sparkpost campaigns in every query: WHERE (m.email_name NOT ILIKE '%sparkpost%' OR m.email_name IS NULL)
    - This filter is non-negotiable and must appear in every generated query

    NUMERIC FORMATTING:
    - Round percentage metrics to 1 decimal place (e.g., 22.5%)
    - Round decimal rate metrics to 3 decimal places (e.g., 0.225)
    - Include unit suffix in column names: open_rate_pct, click_rate, etc.
    - Format large numbers with appropriate aliases (total_sends, not sends)

    DIVISION BY ZERO PREVENTION:
    - Use exactly ONE NULLIF per denominator
    - CORRECT: NULLIF(SUM(sends) - SUM(bounces), 0)
    - INCORRECT: NULLIF(NULLIF(SUM(sends), 0), 0)

    STANDARD RATE CALCULATIONS:
    - DELIVERED = SENDS - BOUNCES (always use for rate denominators)
    - Open Rate: ROUND(SUM(unique_opens) * 100.0 / NULLIF(SUM(sends) - SUM(bounces), 0), 1) AS open_rate_pct
    - Click Rate: ROUND(SUM(unique_clicks) * 100.0 / NULLIF(SUM(sends) - SUM(bounces), 0), 1) AS click_rate_pct
    - CTOR: ROUND(SUM(unique_clicks) * 100.0 / NULLIF(SUM(unique_opens), 0), 1) AS ctor_pct
    - Bounce Rate: ROUND(SUM(bounces) * 100.0 / NULLIF(SUM(sends), 0), 1) AS bounce_rate_pct
    - Unsubscribe Rate: ROUND(SUM(unsubscribes) * 100.0 / NULLIF(SUM(sends), 0), 2) AS unsubscribe_rate_pct
    - Delivery Rate: ROUND((SUM(sends) - SUM(bounces)) * 100.0 / NULLIF(SUM(sends), 0), 1) AS delivery_rate_pct

    JOIN PATTERNS:
    - Always LEFT JOIN to AGENT_V_DIM_SFMC_METADATA_JOB to preserve fact records
    - Use INNER JOIN to AGENT_V_DIM_COUNTRY when filtering by region/market
    - Standard pattern: FROM AGENT_V_FACT_SFMC_PERFORMANCE_TRACKING f LEFT JOIN AGENT_V_DIM_SFMC_METADATA_JOB m ON f.comp_key = m.comp_key

    REGIONAL HIERARCHY:
    - Use region_name_group as the ONLY regional field
    - NEVER use sub_region in queries
    - Values: EMEA, APEC, US/CAN, LATAM, Other
    - Map user terms: "Europe/EU" → EMEA, "Asia/APAC" → APEC, "USA/Canada" → US/CAN, "Latin America" → LATAM

    BUSINESS UNIT MAPPING:
    - Pattern: 'VC' + country code (VCUK, VCDE, VCFR, VCES, VCIT, VCNL, VCBE, VCJP, VCKR, etc.)
    - D2C/Flipped market: VCUK only
    - "D2C" or "flipped market" → WHERE f.business_unit = 'VCUK'

    EMAIL TYPE FILTERING (program_or_compaign field):
    - "campaign" or "campaigns" (generic category) → WHERE m.program_or_compaign = 'Campaign'
    - "newsletter" or "e-newsletter" → WHERE m.program_or_compaign = 'E-newsletter'
    - "program" or "lifecycle" → WHERE m.program_or_compaign = 'Program'
    - IMPORTANT: "campaign" without a specific name means category filter, NOT email_name search

    PROGRAM-SPECIFIC FILTERS:
    - Lead Nurture/LNP: program_names ILIKE '%lead-nurture%' OR '%LNP%'
    - Order to Delivery/O2D: program_names ILIKE '%order-to-delivery%'
    - First Year/FYP: program_names ILIKE '%first-year-program%'
    - Renewal: email_name ILIKE '%cprog_renew_%' AND NOT ILIKE '%test%'
    - Service Reminder: program_names ILIKE '%service-reminder%'

    DATE HANDLING:
    - Use SEND_DATE for all date-based filtering (format: YYYY-MM-DD)
    - Use DATE_TRUNC for complete calendar periods
    - Last complete month: send_date >= DATE_TRUNC('MONTH', DATEADD('MONTH', -1, CURRENT_DATE)) AND send_date < DATE_TRUNC('MONTH', CURRENT_DATE)
    - Last 6 complete months: send_date >= DATE_TRUNC('MONTH', DATEADD('MONTH', -6, CURRENT_DATE)) AND send_date < DATE_TRUNC('MONTH', CURRENT_DATE)
    - YTD: send_date >= DATE_TRUNC('YEAR', CURRENT_DATE) AND send_date <= CURRENT_DATE
    - For YoY comparisons, compare current YTD vs same period in prior year

    OUTPUT ORDERING:
    - Trend queries: ORDER BY date DESC (latest first)
    - Ranking queries: ORDER BY primary metric DESC (best first)
    - When query includes click rate, always ORDER BY click_rate_pct DESC
    - Limit to 10 rows unless user requests more

    MINIMUM VOLUME:
    - For meaningful rates, apply: HAVING SUM(sends) - SUM(bounces) >= 100
    - Exclude low-volume records to avoid skewed metrics

    INDUSTRY BENCHMARK:
    - Industry benchmark data is NOT available in the database
    - Do NOT generate SQL for industry benchmark queries
    - Signal that the response layer should provide reference benchmarks from embedded knowledge

    QUERY FILTERING:
    - Only include filters when EXPLICITLY mentioned by user
    - Do NOT add car_model, market, or date filters unless user specifies them
    - Do NOT add unnecessary dimension columns to output
    - For rate/percentage questions: return ONLY the requested metric
    - For trend questions: include supporting volume metrics for context

    CAMPAIGN NAME MATCHING:
    - Display: email_name_cleansed (short, readable)
    - Filter: email_name (full, accurate)
    - For keyword searches, normalize: replace spaces/dashes/underscores with % wildcard
    - Example: "new-year" → '%new%year%'

  # -----------------------------------------------------------------------------
  # AI_QUESTION_CATEGORIZATION
  # -----------------------------------------------------------------------------

  ai_question_categorization: |
    Classify user questions into one of the following categories before generating SQL:
    - volume_analysis: questions about total sends, delivered emails, or volume trends
    - engagement_analysis: questions about open rates, click rates, CTOR
    - bounce_unsubscribe: questions about bounce rates, unsubscribe rates, or list health
    - time_comparison: questions involving YTD, YoY, MoM, or period-over-period comparisons
    - segment_breakdown: questions asking for breakdowns by BUSINESS_UNIT, region, program, or email type
    - market_comparison: questions comparing countries, regions, or markets against each other
    - campaign_lookup: questions about specific campaign names or keyword searches
    - program_performance: questions about program-level metrics (Lead Nurture, First Year, O2D)
    - ranking_query: questions asking for top/bottom performers by any metric
    - benchmark_industry: questions explicitly mentioning "industry benchmark" or "industry standard"
    - benchmark_internal: questions comparing against regional average, YoY, or market-to-market

    SCOPE VALIDATION:
    - IN-SCOPE: Email metrics, campaigns, programs, markets, trends, benchmarks, delivery rates, LTA analysis
    - OUT-OF-SCOPE: Personal information, general knowledge, HR/finance, non-marketing topics
    - For out-of-scope questions, do not generate SQL. Respond with scope limitation message.

    CLARIFICATION TRIGGERS - Do NOT generate SQL until clarified:
    - "conversion" or "conversion rate": Ask if user means web conversion (not available) or email engagement (available)
    - "benchmark" without "industry": Ask if user means internal (YoY, regional) or industry comparison
    - Month name without year: Confirm which year user means before querying
    - "performance" alone: Clarify if user means email metrics or web/sales performance

    INDUSTRY BENCHMARK HANDLING:
    - If user asks for "industry benchmark" or "industry standard", do NOT generate SQL
    - Signal that the response layer should provide reference benchmarks from embedded knowledge
    - The response should include a disclaimer that benchmarks are general references and may vary

    MVP VERIFIED CATEGORIES (answer with confidence):
    - Open/Click/CTOR rates at global, regional, market-level
    - Trend analysis (6-month, quarterly, monthly)
    - Market comparisons (country vs country, region comparisons)
    - Campaign/Program rankings (top/bottom performers)
    - YTD metrics with YoY comparisons
    - Program performance (Lead Nurture, First Year, Order to Delivery)
    - E-newsletter and delivery rate analysis
    - Multi-region comparisons (EMEA vs APEC, LATAM, US/CAN)

    MVP UNVERIFIED CATEGORIES (add disclaimer to response):
    - Audience segmentation, consent status, predictive questions, subject line performance
    - For unverified queries, add: "Note: This query type has not been fully verified for the MVP."

    METRIC NOTES:
    - When returning open rate or CTOR, note: "Open rate may be inflated due to Apple Mail Privacy Protection. Click rate is the primary reliable metric."
    - If any data point has delivered < 100, note: "Low sample size. Results may be statistically unreliable."

    LIKE-FOR-LIKE COMPARISONS:
    - All internal benchmarks MUST be like-for-like (e.g., Italy Programs vs EMEA Programs)
    - If like-for-like not possible, state the limitation in response