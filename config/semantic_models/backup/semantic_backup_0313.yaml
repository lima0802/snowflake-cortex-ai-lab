name: SFMC_EMAIL_PERFORMANCE_PROD
description: >
  Salesforce Marketing Cloud email campaign performance analytics for Volvo Cars. Tracks sends, opens, clicks, bounces, and unsubscribes across business units and markets. Primary use cases: campaign performance monitoring, engagement rate analysis, market comparisons, and trend reporting.

tables:
  # ── AGENT_V_DIM_COUNTRY────────────────────────────────────────────────────────────
  - name: AGENT_V_DIM_COUNTRY
    description: >
      Dim table contains records of countries with their associated geographic and business classifications. Each record represents a single country and includes regional groupings, sales territories, and market designations used for organizational reporting and analysis.
    base_table:
      database: PROD_MARCOM_DB
      schema: AGENT_DIRECTMARKETING
      table: AGENT_V_DIM_COUNTRY

    dimensions:
      - name: COUNTRY_CODE
        synonyms:
          - COUNTRY_ABBREVIATION
          - COUNTRY_ISO
          - ISO_CODE
          - ISO_COUNTRY_CODE
          - TWO_LETTER_CODE
        description: >
          The standardized country code (ISO format).
        expr: COUNTRY_CODE
        data_type: VARCHAR(200)
        sample_values:
          - "UK"
          - "DE"
          - "FR"

      - name: COUNTRY_NAME
        synonyms:
          - COUNTRY
          - COUNTRY_LABEL
          - COUNTRY_TITLE
          - GEOGRAPHIC_NAME
          - LOCATION_NAME
          - NATION
          - NATION_NAME
          - STATE_NAME
          - TERRITORY_NAME
        description: >
          The full name of the country.
        expr: COUNTRY_NAME
        data_type: VARCHAR(200)
        sample_values:
          - "Belgium"
          - "Albania"
          - "North Macedonia"

      - name: MARKET_CD
        synonyms:
          - COMMERCIAL_MARKET_ID
          - MARKET_CODE
          - MARKET_DESIGNATION
          - MARKET_ID
          - MARKET_IDENTIFIER
          - MARKET_SEGMENT_CODE
          - MKT_CD
          - MKT_CODE
          - TRADING_MARKET_CODE
        description: >
          The market code identifier (numeric).
        expr: MARKET_CD
        data_type: NUMBER(38,0)
        sample_values:
          - "441"
          - "434"
          - "481"

      - name: REGION_NAME_GROUP
        synonyms:
          - AREA
          - CONTINENT
          - GEOGRAPHIC_REGION
          - HIGH_LEVEL_REGION
          - REGION
          - REGION_GROUP
          - REGION_NAME
          - REGIONAL_GROUPING
          - TOP_LEVEL_REGION
        description: >
          The primary regional grouping field for global aggregation and reporting.
        expr: REGION_NAME_GROUP
        data_type: VARCHAR(100)
        sample_values:
          - "APEC"
          - "EMEA"
          - "US/CAN"
          - "LATAM"
          - "Other"

      - name: SALES_AREA
        synonyms:
          - BUSINESS_AREA
          - COMMERCIAL_AREA
          - DETAILED_REGION
          - DISTRIBUTION_AREA
          - MARKET_AREA
          - MARKET_SEGMENT
          - MARKET_TERRITORY
          - SALES_DISTRICT
          - SALES_REGION
          - SALES_TERRITORY
          - SALES_ZONE
        description: >
          The sales area designation for the country.
        expr: SALES_AREA
        data_type: VARCHAR(100)
        sample_values:
          - "Nordics"
          - "Central Europe"
          - "Western Europe"
          - "UK & Ireland"
          - "Eastern Europe"
          - "EMEA Importers"
          - "APEC NSC"
          - "APEC Importers"
          - "USA and Canada"
          - "LATAM NSC"
          - "LATAM Importers"
          - "Greater China"
          - "Global App"
          - "Multi-market app"
          - "Global Major Accounts"

      - name: SUB_REGION
        synonyms:
          - REGIONAL_SEGMENT
          - SUB_REGION_NAME
          - SUBREGION
        description: >
          Sub-regional grouping for more granular geographic analysis.
        expr: SUB_REGION
        data_type: VARCHAR(100)
        sample_values:
          - "APEC"
          - "EMEA"
          - "Greater China"
          - "LATAM"
          - "Other"
          - "USA and Canada"

      - name: VC_COUNTRY_CODE
        synonyms:
          - BU_CODE
          - BUSINESS_UNIT
          - INTERNAL_COUNTRY_CODE
          - VC_CODE
          - VC_COUNTRY_ID
          - VC_COUNTRY_IDENTIFIER
          - VC_COUNTRY_REF
          - VOLVO_CARS_COUNTRY_CODE
          - VOLVO_COUNTRY_CODE
          - VOLVO_COUNTRY_ID
        description: >
          Volvo Cars specific country code identifier.
          Primary key for joining to fact table via BUSINESSUNIT.
          Examples: VCUK, VCDE, VCFR, VCES, VCIT, VCNL, VCBE, VCJP, VCKR.
        expr: VC_COUNTRY_CODE
        data_type: VARCHAR(202)
        sample_values:
          - "VCMK"
          - "VCAL"
          - "VCFR"

    # ── Filters ────────────────────────────────────────────────────────────────
    filters:
      - name: D2C_market
        description: >
          markets that sell direct to consumers (currently only UK)
        expr: vc_country_code = 'VCUK'

      - name: apac_region
        description: >
          Filters for Asia Pacific (APEC) region markets. Use when questions ask about 'Asia', 'Asia Pacific', 'APAC', 'Asian markets', 'Pacific region', or mention specific APAC countries like Japan, Korea, Australia, China. Helps analyze performance across the Asia Pacific regional grouping for geographic comparisons and regional strategy assessment.
        expr: region_name_group = 'APEC'

      - name: emea_region
        description: >
          Filters for Europe, Middle East, and Africa (EMEA) region markets at the highest level. Use when questions ask about 'Europe', 'European markets', 'EMEA', 'EU performance', 'European region', 'Middle East', 'Africa' as a whole region. For specific sub-regions like Nordics, Central Europe, or Western Europe, use the corresponding sub-region filters instead. Helps analyze performance across the entire EMEA regional grouping.
        expr: region_name_group = 'EMEA'

      - name: latam_region
        description: >
          Filters for Latin America (LATAM) region markets. Use when questions ask about 'Latin America', 'LATAM', 'South America', 'Central America', 'LatAm', or mention specific Latin American countries like Mexico, Brazil, Argentina. Helps analyze performance across the Latin American regional grouping for geographic comparisons and regional strategy assessment.
        expr: region_name_group = 'LATAM'

      - name: other_region
        description: >
          Filters for markets classified as 'Other' region. Use only when user explicitly mentions 'Other' region or asks about markets not belonging to EMEA, APEC, US/CAN, or LATAM regional groupings. Do not apply this filter for general or global queries. Helps isolate performance for markets outside the main regional classifications.
        expr: region_name_group = 'Other'

      - name: us_can_region
        description: >
          Filters for North America (US/CAN) region markets. Use when questions ask about 'USA', 'US', 'United States', 'America', 'American markets', 'Canada', 'Canadian', 'North America', 'NA', or mention specific North American markets. Helps analyze performance across the United States and Canada regional grouping for geographic comparisons and regional strategy assessment.
        expr: region_name_group = 'US/CAN'

    # ── Primary_key ────────────────────────────────────────────────────────────────
    primary_key:
      columns:
        - VC_COUNTRY_CODE

  # ── AGENT_V_DIM_SFMC_ALIAS ────────────────────────────────────────────────────────────
  - name: AGENT_V_DIM_SFMC_ALIAS
    description: >
      Dim table contains records of email content blocks used in marketing communications. Each record represents a specific block within an email and includes details about the block's type, position, and associated link tracking information.
    base_table:
      database: PROD_MARCOM_DB
      schema: AGENT_DIRECTMARKETING
      table: AGENT_V_DIM_SFMC_ALIAS

    dimensions:
      - name: ALIAS
        synonyms:
          - ALTERNATE_NAME
          - NICKNAME
          - OBJECT_NAME
          - REFERENCE_NAME
          - SECONDARY_IDENTIFIER
        description: >
          An alternative name used to reference an object.
        expr: ALIAS
        data_type: VARCHAR(16777216)
        sample_values:
          - "others"
          - "EX40_BEV_features_BlockType%3a%3a1COLB_BlockPosition%3a%3a2_LinkType%3a%3aCTA1_LinkText%3a%3aUtforskadinVolvo_LanguageCode%3a%3aSV%26OTD_GUID_37ba29dc-ff8c-4b1f-901e-e583bf6ac39b"
          - "EX40_BEV_features_BlockType%3a%3a1COLB_BlockPosition%3a%3a3_LinkType%3a%3aCTA1_LinkText%3a%3aTutustuVolvoosi_LanguageCode%3a%3aFI%26OTD_GUID_6a2d439b-2621-4ca3-adff-361009bd3b72"

      - name: ALIAS_RAW
        synonyms:
          - ORIGINAL_ALIAS
          - RAW_IDENTIFIER
          - SOURCE_ALIAS
          - UNPROCESSED_NAME
        description: >
          Raw alias data before processing or transformation.
        expr: ALIAS_RAW
        data_type: VARCHAR(16777216)
        sample_values:
          - "https://www.volvocars.com/uk/cars/es90-electric/?email_name=VCUK_LCAMP_20250905_10055-for-life-in-balance_ES90-finance-options_EDM1_V1_EN&jobid=2196537&batchid=8&subscriberKey=Mmv0vCkXv9ceJnbtNtqWwnJegWJTzofQ&utm_source=sfmc&utm_medium=email&utm_content=https%3a%2f%2fwww.volvocars.com%2fuk%2fcars%2fes90-electric%2f&utm_campaign=VCUK_LCAMP_20250905_10055-for-life-in-balance_ES90-finance-options_EDM1_V1_EN&campaignCode=&sfmc_id=333062095&hem=c401145f9b75fa33bced6f42f6635b87ec1669f4d56401947c7a28f0ad73288c&ns-EncryptedId=A0xrexGbOi1OXHKBJCKqmSip4dah9o8N"
          - "https://www.volvocars.com/us/?utm_source=sfmc&utm_medium=email&utm_content=https%3a%2f%2fwww.volvocars.com%2fus%2f&utm_campaign=VCUS_NOT_CENEWS_20251105_B2C_global-enewsletter-October-2025-All_EDM1_V2_USEN&campaignCode=&email_name=VCUS_NOT_CENEWS_20251105_B2C_global-enewsletter-October-2025-All_EDM1_V2_USEN&hem=a82775adcd90ea263830a16d23d14e6fd7999f262c2ccccca56e77f1bf5d1dbb&ns-EncryptedId=1OUCp+q9DLj7jZlXGtNlM4iL4r2x83azOnn6AebDwNuJsR5iDn+Bjg==&jobid=2208787&batchid=1959&subscriberKey=Bv2EUarhkf5PP6psHtZ/zg==&sfmc_journey_id=c5a5b0e8-b498-4cf4-971a-c8b1b1847e86&sfmc_journey_name=CVSUN_TOC_NEWE_S02521150B_C2g_olab-lnewelsteet-rcOoteb-r0252A-llE_MD_12VU_ESN&sfmc_activity_id=528eda0a-006b-43b5-b365-0ab006035477&sfmc_activity_name=CVSUN_TOC_NEWE_S02521150B_C2g_olab-lnewelsteet-"
          - "https://www.volvocars.com/uk/car-finance/faq/volvo-loan/?category=Delivery&utm_source=sfmc&utm_term=&utm_content=4600219&utm_id=dcd193ac-5aa0-473c-b4f1-9be715a03fdd&sfmc_id=945846460&sfmc_activityid=76738ab8-e0ee-49c9-8e75-145e5ceb9ea4&utm_medium=email&utm_campaign=VCUK_CPROG_order-to-delivery_before-delivery_eDM5_V2_EN&email_name=VCUK_CPROG_order-to-delivery_before-delivery_eDM5_V2_EN&jobid=2153516&batchid=212&subscriberKey=goqLAT5/JoH5xzE+mRMJ5SfWDYh+kXmy&utm_source=sfmc&utm_medium=email&utm_content=cbv-otd_cta-link_order-tracking-dynamic&utm_campaign=VCUK_CPROG_order-to-delivery_before-delivery_eDM5_V1_EN&campaignCode=&sfmc_id=945846460&hem=6cd4b341f1f13ddce8b98816875fee43d1755ef5cfc8494fedc973ce27b6a886&ns-EncryptedId=gK4H2hZU5ECP5C+iaj7txXJpaeKXrOgh"

      - name: BLOCKPOSITION
        synonyms:
          - BLOCK_LOCATION
          - BLOCK_ORDER
          - CONTENT_POSITION
          - LAYOUT_INDEX
          - SECTION_PLACEMENT
        description: >
          The specific location of a content block within the layout of a document or email template.
        expr: BLOCKPOSITION
        data_type: VARCHAR(16777216)
        sample_values:
          - "2"
          - "6"

      - name: BLOCKTYPE
        synonyms:
          - BLOCK_CATEGORY
          - BLOCK_CLASSIFICATION
          - CONTENT_CATEGORY
          - CONTENT_TYPE
          - SECTION_TYPE
        description: >
          The categorization of a content block within a document or email template.
        expr: BLOCKTYPE
        data_type: VARCHAR(16777216)
        sample_values:
          - "1COLB"
          - "3GRIDB"

      - name: LINKTEXT
        synonyms:
          - ANCHOR_TEXT
          - CLICKABLE_TEXT
          - DISPLAY_TEXT
          - HYPERLINK_TEXT
          - LINK_LABEL
        description: >
          The visible, clickable text part of a hyperlink that users interact with.
        expr: LINKTEXT
        data_type: VARCHAR(16777216)
        sample_values:
          - "Kaikkilataamisesta"
          - "Alltomladdning"
          - "JetztKontoerstellen"

      - name: LINKTRACKINGALIAS
        synonyms:
          - CLICK_TRACKING_ID
          - LINK_TRACKING_NAME
          - TRACKING_IDENTIFIER
          - URL_TRACKING_ALIAS
        description: >
          Link tracking alias used for monitoring and measuring click-through performance in marketing campaigns.
        expr: LINKTRACKINGALIAS
        data_type: VARCHAR(16777216)
        sample_values:
          - "VolvoCarsApp"
          - "Electrification"

      - name: LINKTYPE
        synonyms:
          - HYPERLINK_CLASSIFICATION
          - LINK_CATEGORY
          - LINK_FUNCTION
          - LINK_PURPOSE
          - URL_TYPE
        description: >
          The classification of a link, indicating its purpose or function, such as image, cta, etc.
        expr: LINKTYPE
        data_type: VARCHAR(16777216)
        sample_values:
          - "RichTextLink3"
          - "RichTextLink1"

    # ── Primary_key ────────────────────────────────────────────────────────────────
    primary_key:
      columns:
        - ALIAS

  # ── AGENT_V_DIM_SFMC_METADATA_JOB ────────────────────────────────────────────────────────────
  - name: AGENT_V_DIM_SFMC_METADATA_JOB
    description: >
      Dim table contains records of email marketing campaigns and their associated metadata. Each record represents a single email send and includes details about the campaign configuration, target audience segmentation by vehicle model and geographic region, and compliance tracking.
    base_table:
      database: PROD_MARCOM_DB
      schema: AGENT_DIRECTMARKETING
      table: AGENT_V_DIM_SFMC_METADATA_JOB

    dimensions:
      - name: AB_TESTING
        synonyms:
          - A/B_TEST
          - AB_TEST
          - EXPERIMENT
          - MULTIVARIATE_TEST
          - SPLIT_TEST
          - TEST_VERSION
        description: >
          A method of marketing testing where two versions (A and B) are compared to determine which one performs better.
        expr: AB_TESTING
        data_type: VARCHAR(16777216)
        sample_values:
          - "B"
          - "A"

      - name: BUSINESS_UNIT
        synonyms:
          - BU
          - COUNTRY_CODE
          - MARKET
          - MARKET_CODE
          - MARKET_IDENTIFIER
          - VC_CODE
        description: >
          A distinct section within an organization representing a market.
        expr: BUSINESS_UNIT
        data_type: VARCHAR(16777216)
        sample_values:
          - "VCCA"
          - "VCIN"
          - "VCPT"

      - name: CAR_MODEL
        synonyms:
          - CAR
          - CAR_MODEL
          - CAR_TYPE
          - MODEL
          - MODEL_NAME
          - VEHICLE
          - VEHICLE_MODEL
        description: >
          The specific make and design of a car as classified as model.
        expr: UPPER(TRIM(CAR_MODEL))
        data_type: VARCHAR(15)
        sample_values:
          - "None"
          - "XC90"
          - "EX30"

      - name: CATALYST_COUNTRY_CODE
        synonyms:
          - BRIEF_COUNTRY
          - CATALYST_COUNTRY
          - CATALYST_COUNTRY_ABBREVIATION
          - CATALYST_COUNTRY_CODE
          - CATALYST_COUNTRY_ID
          - CATALYST_COUNTRY_IDENTIFIER
          - CATALYST_ISO_COUNTRY_CODE
          - CATALYST_MARKET
          - CATALYST_NATION_CODE
          - CATALYST_ORIGIN_COUNTRY_CODE
          - CATALYST_TERRITORIAL_CODE
        description: >
          An identifier representing the country of origin or use related to a particular catalyst.
        expr: CATALYST_COUNTRY_CODE
        data_type: VARCHAR(16777216)
        sample_values:
          - "VCCH"
          - "VCJP"

      - name: CATALYST_TYPE
        synonyms:
          - BRIEF_TYPE
          - CATALYST_CATEGORY
          - CATALYST_TYPE
        description: >
          The type of catalyst/campaign classification.
        expr: CATALYST_TYPE
        data_type: VARCHAR(16777216)
        sample_values:
          - "CPROG"
          - "CENEWS"

      - name: COMMUNICATION_CATEGORY
        synonyms:
          - CATEGORY
          - COMMUNICATION_CATEGORY
          - CONTENT_CATEGORY
          - EMAIL_CATEGORY
          - MESSAGE_CATEGORY
        description: >
          Category of communication.
        expr: COMMUNICATION_CATEGORY
        data_type: VARCHAR(16777216)
        sample_values:
          - "NOT"
          - "EVT"

      - name: COMPLIANT
        synonyms:
          - COMPLIANCE
          - COMPLIANCE_STATUS
          - COMPLIANT
          - COMPLIANT_STATUS
        description: >
          The state of adherence to rules, regulations, or specified standards within an email or marketing context.
        expr: COMPLIANT
        data_type: VARCHAR(13)
        sample_values:
          - "compliant"
          - "non compliant"

      - name: COMP_KEY
        synonyms:
          - BUSINESS_SEND_KEY
          - COMPOSITE_KEY
          - JOIN_KEY
          - RECORD_KEY
          - UNIQUE_KEY
        description: >
          Composite key - unique identifier created by combining SEND_ID and BUSINESS_UNIT.
        expr: COMP_KEY
        data_type: VARCHAR(16777216)
        sample_values:
          - "2207635VCDE"
          - "2215541VCMX"
          - "2205462VCCH"

      - name: DASHBOARD_CAR_MODEL
        synonyms:
          - DASHBOARD_MODEL
          - DISPLAY_MODEL
          - REPORTING_MODEL
        description: >
          Car model categorization for dashboard reporting.
        expr: UPPER(TRIM (DASHBOARD_CAR_MODEL))
        data_type: VARCHAR(54)
        sample_values:
          - "ES90"
          - "EX60"
          - "XC60"

      - name: EMAIL_LANGUAGE
        synonyms:
          - COMMUNICATION_LANGUAGE
          - CONTENT_LANGUAGE
          - EMAIL_LANGUAGE
          - LANGUAGE
          - LOCALE
        description: >
          The language in which the email content is written.
        expr: EMAIL_LANGUAGE
        data_type: VARCHAR(16777216)
        sample_values:
          - "JA"
          - "EN"

      - name: EMAIL_NAME
        synonyms:
          - ASSET_NAME
          - CAMPAIGN_NAME
          - CREATIVE_NAME
          - EMAIL_NAME
          - EMAIL_TITLE
          - MESSAGE_TITLE
          - SEND_NAME
        description: >
          The name or title assigned to a particular email as a reference for identification.
        expr: UPPER(EMAIL_NAME)
        data_type: VARCHAR(50331648)
        sample_values:
          - "VCUK_NOT_CENEWS_20251218_B2C_global-enewsletter-December-2025-All_EDM1_V2_EN"
          - "VCZA_NOT_CENEWS_20250625_B2C_global-enewsletter-June-2025-All_EDM1_V1_EN"
          - "VCFI_CPROG_OTD_Redesign_Accessories_EDM2_V3_SEFI"

      - name: EMAIL_NAME_CLEANSED
        synonyms:
          - CLEAN_NAME
          - CLEANSED_NAME
          - NORMALIZED_NAME
          - STANDARDIZED_NAME
        description: >
          The email name that has been modified for consistency or analysis purposes.
          Cleaner version of EMAIL_NAME for grouping and reporting.
        expr: EMAIL_NAME_CLEANSED
        data_type: VARCHAR(16777216)
        sample_values:
          - "6monthplus_6monthplus"
          - "TestDrive_XC40UltraB3"
          - "POP Service - Service Reminder Y1 v3 2504"

      - name: EMAIL_SEND_NUMBER
        synonyms:
          - DROP_NUMBER
          - EDM
          - EDM_NUMBER
          - SEND_NUMBER
          - SEND_SEQUENCE
          - SEND_WAVE
          - SEQUENCE
          - WAVE
        description: >
          EDM plus a sequential number representing the sent emails in a campaign, representing different sends part of the same campaign
        expr: EMAIL_SEND_NUMBER
        data_type: VARCHAR(16777216)
        sample_values:
          - "EDM9"
          - "EDM0"
          - "EDM4"

      - name: EMAIL_SEND_PROCESS
        synonyms:
          - CREATION_PROCESS
          - DIRECT_ENGINE
          - EMAIL_PROCESS
          - ENGINE
          - PLATFORM
          - SEND_PROCESS
        description: >
          The workflow involved in the preparation and dispatch of an email campaign.
        expr: EMAIL_SEND_PROCESS
        data_type: VARCHAR(16777216)
        sample_values:
          - "Outside Direct Engine"
          - "Direct Engine"

      - name: EMAIL_SOURCE
        synonyms:
          - CREATION_SOURCE
          - EMAIL_SOURCE
          - ORIGIN_PLATFORM
          - SOURCE
        description: >
          The origin of the email's content, list, or creative elements.
        expr: EMAIL_SOURCE
        data_type: VARCHAR(8)
        sample_values:
          - "Catalyst"
          - "SFMC"

      - name: EMAIL_SUBJECT_LINE
        synonyms:
          - EMAIL_SUBJECT
          - HEADLINE
          - SL
          - SUBJECT
          - SUBJECT_LINE
          - TITLE
        description: >
          The subject line text used in the email campaign.
        expr: EMAIL_SUBJECT_LINE
        data_type: VARCHAR(16777216)
        sample_values:
          - "La tua garanzia Volvo è in scadenza."
          - "Meet the refreshed XC60"
          - "Innovaciones de Volvo. Las puedes tener todas"

      - name: EMAIL_VERSION
        synonyms:
          - CREATIVE_VERSION
          - EMAIL_VERSION
          - REVISION
          - VARIANT
          - VERSION
        description: >
          The specific variation of an email.
        expr: EMAIL_VERSION
        data_type: VARCHAR(16777216)
        sample_values:
          - "V3"
          - "V1"

      - name: GEOGRAPHIC_SCOPE
        synonyms:
          - CENTRAL_OR_LOCAL
          - GEO_SCOPE
          - GEOGRAPHIC_SCOPE
          - REGION_SCOPE
          - SCOPE
        description: >
          The range of areas covered by the campaign.
          Values: Central, Local.
        expr: GEOGRAPHIC_SCOPE
        data_type: VARCHAR(16777216)
        sample_values:
          - "Local"
          - "Central"

      - name: PROGRAM_NAMES
        synonyms:
          - AUTOMATION_NAME
          - JOURNEY_NAME
          - PROGRAM
          - PROGRAM_IDENTIFIER
          - PROGRAM_NAME
        description: >
          The names of marketing programs within an organization.
        expr: PROGRAM_NAMES
        data_type: VARCHAR(16777216)
        sample_values:
          - "first-year-program"
          - "service-reminder"

      - name: PROGRAM_OR_COMPAIGN
        synonyms:
          - CAMPAIGN_TYPE
          - COMMUNICATION_TYPE
          - CONTENT_TYPE
          - EMAIL_TYPE
          - PROGRAM_OR_CAMPAIGN
          - TYPE
        description: >
          Classifies email communication type based on email naming conventions.
          - 'Program': Automated lifecycle emails. Identified by 'CPROG' in name, or patterns like 'order to delivery', 'lead nurture', 'volvo cars app', 'first year', 'FYP', 'service reminder'
          - 'E-newsletter': News communications. Identified by 'CENEWS' in name, or patterns like 'global-enewsletter', 'Enewsletter', 'E_newsletter'
          - 'Campaign': Marketing campaign emails (default for other emails). Fixed sends based on business objectives.
          IMPORTANT: When user asks about "campaign" or "campaigns" in general (without specifying a campaign name), they are referring to the CATEGORY 'Campaign', not a specific email name. Always filter by program_or_compaign = 'Campaign' unless the user provides a specific campaign name.
        expr: PROGRAM_OR_COMPAIGN
        data_type: VARCHAR(12)
        sample_values:
          - "Program"
          - "E-newsletter"
          - "Campaign"

      - name: SEND_ID
        synonyms:
          - EMAIL_JOB
          - JOB_ID
          - JOB_NUMBER
          - SEND_IDENTIFIER
          - SEND_JOB
        description: >
          The ID associated with the send.
        expr: SEND_ID
        data_type: NUMBER(38,0)
        sample_values:
          - "2220086"
          - "2202698"
          - "2189614"

      - name: SEND_TYPE
        synonyms:
          - DELIVERY_TYPE
          - EMAIL_SEND_TYPE
          - SEND_TYPE
        description: >
          The classification of an email send based on its purpose.
          Values: Program, Campaign.
        expr: SEND_TYPE
        data_type: VARCHAR(16777216)
        sample_values:
          - "Program"
          - "E-newsletter"

    # ── Date ────────────────────────────────────────────────────────────────
    time_dimensions:
      - name: SEND_DATE
        synonyms:
          - CAMPAIGN_DATE
          - DATE
          - DATE_SENT
          - EMAIL_DATE
          - SEND_DATE
          - SENT_DATE
        description: >
          The date on which an email was sent to recipients.
          Use for time-based analysis of campaign metadata.
        expr: SEND_DATE
        data_type: DATE
        sample_values:
          - "2025-12-09"
          - "2025-09-01"
          - "2025-10-10"

    # ── Filters ────────────────────────────────────────────────────────────────
    filters:
      - name: campaign
        description: >
          Use this filter when user asks about "campaign" or "campaigns" as a CATEGORY (not a specific campaign name).
          This filter ensures only 'Campaign' category emails are included (fixed sends based on business objectives like new model launches), excluding Programs and E-newsletters.
        expr: program_or_compaign = 'Campaign'

      - name: catalyst_emails
        description: >
          Direct engine emails - briefed and created through Catalyst platform
        expr: EMAIL_SOURCE = 'Catalyst'

      - name: central_campaign
        description: >
          Program emails with central/global scope. Use when user asks about "central campaigns" ,"HQ campaigns", or "centrally managed campaigns".
        expr: GEOGRAPHIC_SCOPE = 'Central' AND PROGRAM_OR_COMPAIGN = 'Campaign'

      - name: central_program
        description: >
          Program emails with central/global scope. Use when user asks about "central programs" ,"HQ programs", or "centrally managed programs".
        expr: GEOGRAPHIC_SCOPE = 'Central' AND PROGRAM_OR_COMPAIGN = 'Program'

      - name: direct_engine
        description: >
          Emails briefed and created through the Catalyst direct engine platform. Use when user asks about "direct engine", "Catalyst emails", "Catalyst briefed", or "DE emails".
        expr: EMAIL_SEND_PROCESS = 'Direct Engine'

      - name: direct_engine_campaign
        description: >
          Marketing campaign emails created through Catalyst. Use when user asks about "direct engine campaigns", "Catalyst campaigns", or "DE campaigns".
        expr: EMAIL_SEND_PROCESS = 'Direct Engine' AND PROGRAM_OR_COMPAIGN ='Campaign'

      - name: direct_engine_enewsletter
        description: >
          E-newsletter emails created through Catalyst. Use when user asks about "direct engine newsletters", "Catalyst newsletters", or "DE enews".
        expr: EMAIL_SEND_PROCESS = 'Direct Engine' AND PROGRAM_OR_COMPAIGN = 'E-newsletter'

      - name: direct_engine_program
        description: >
          Automated program emails created through Catalyst. Use when user asks about "direct engine programs", "Catalyst programs", or "DE programs".
        expr: EMAIL_SEND_PROCESS = 'Direct Engine' AND PROGRAM_OR_COMPAIGN = 'Program'

      - name: eNewsletters
        description: >
          Use on campaign metadata to include only programs based on category is 'E-newsletter'. Use when user asks about "global eNewsletter", "Enewsletter", "E_newsletter", "Enews". eNewsletters: monthly newsletters (not sent in all markets, and not always monthly) , news communications. Identified by 'CENEWS' in name, or patterns like 'global-enewsletter', 'Enewsletter', 'E_newsletter'
        expr: program_or_compaign = 'E-newsletter'

      - name: first_year_program
        description: >
          First Year Program emails - automated emails for customers in their first year of ownership. Use when user asks about "first year program", "FYP", "first year", "new owner program", or "year one".
        expr: PROGRAM_OR_COMPAIGN = 'Program' AND PROGRAM_NAMES ILIKE '%first-year-program%'

      - name: Is_AB_test
        description: >
          AB Testing Boolean flag
        expr: AB_TESTING IS NOT NULL

      - name: lead_nurture_program
        description: >
          Lead Nurture Program emails - automated nurturing sequence for leads. Use when user asks about "lead nurture", "LNP", "lead nurturing", "nurture program", or "lead program".
        expr: PROGRAM_OR_COMPAIGN = 'Program' AND (PROGRAM_NAMES ILIKE '%lead-nurture%' OR PROGRAM_NAMES ILIKE '%lead-nurture-2%' OR PROGRAM_NAMES ILIKE '%LNP%')

      - name: local_program
        description: >
          Program emails with local/market-specific scope. Use when user asks about "local programs", "market-specific programs", or "local automated emails".
        expr: GEOGRAPHIC_SCOPE = 'Local' AND PROGRAM_OR_COMPAIGN = 'Program'

      - name: order_to_delivery_program
        description: >
          Order to Delivery Program emails - automated emails tracking customer journey from order to vehicle delivery. Use when user asks about "order to delivery", "O2D", "OTD", "delivery program", or "order program".
        expr: PROGRAM_OR_COMPAIGN = 'Program' AND PROGRAM_NAMES ILIKE '%order-to-delivery%'

      - name: outside_direct_engine
        description: >
          Emails created outside the Catalyst platform, directly in SFMC. Use when user asks about "outside direct engine", "non-Catalyst", "ODE", "SFMC direct", or "manual emails".
        expr: EMAIL_SEND_PROCESS = 'Outside Direct Engine'

      - name: outside_direct_engine_campaign
        description: >
          Marketing campaign emails created outside Catalyst. Use when user asks about "ODE campaigns", "non-Catalyst campaigns", or "manual campaigns".
        expr: EMAIL_SEND_PROCESS = 'Outside Direct Engine' AND PROGRAM_OR_COMPAIGN = 'Campaign'

      - name: outside_direct_engine_program
        description: >
          Automated program emails created outside Catalyst (directly in SFMC). Use when user asks about "ODE programs", "non-Catalyst programs", or "manual programs".
        expr: EMAIL_SEND_PROCESS = 'Outside Direct Engine' AND PROGRAM_OR_COMPAIGN = 'Program'

      - name: program
        description: >
          Use on campaign metadata to include only programs based on category is 'Program'. Programs: triggered emails, based on behaviour (ex. first year after buying a car), automated lifecycle emails. Identified by 'CPROG' in name, or patterns like 'order to delivery', 'lead nurture', 'volvo cars app', 'first year', 'FYP', 'service reminder'
        expr: program_or_compaign = 'Program'

      - name: renew_program
        description: >
          Renew Program emails - automated renewal/retention emails for existing customers. Use when user asks about "renew program", "renewal", "retention program", "renew emails", or "customer renewal".
        expr: PROGRAM_OR_COMPAIGN = 'Program' AND EMAIL_NAME ILIKE '%cprog_renew_%' AND EMAIL_NAME NOT ILIKE '%test%'

      - name: sfmc_emails
        description: >
          Outside direct engine - emails created directly in Salesforce Marketing Cloud
        expr: email_source = 'SFMC'

    # ── Metrics ────────────────────────────────────────────────────────────────
    metrics:
      - name: UNIQUE_CAMPAIGN_COUNT
        description: >
          Counts the number of distinct email campaigns or email names. Use when questions ask about 'number of campaigns', 'how many emails', 'campaign count', 'email variety', or 'campaign diversity'. Helps measure campaign activity volume, analyze campaign portfolio size, and compare campaign frequency across different time periods, markets, or campaign types.
        expr: COUNT(DISTINCT email_name)
        access_modifier: public_access

    # ── Primary_key ────────────────────────────────────────────────────────────────
    primary_key:
      columns:
        - COMP_KEY

