# ── Queries ────────────────────────────────────────────────────────────────
verified_queries:
  # ── Email-level Performance ────────────────────────────────────────────────────────────────
  - name: GLOBAL_EDM_OPEN_RATE_LAST_MONTH
    question: "What was the open rate for last month's global EDM campaign?"
    verified_by: "Analytics Team"
    verified_at: "2026-03-13"
    use_as_onboarding_question: true
    sql: |-
      SELECT
        m.email_name AS campaign_name,
        f.business_unit AS market,
        SUM(f.sends) AS total_sends,
        SUM(f.sends) - SUM(f.bounces) AS total_delivered,
        ROUND(
          SUM(f.unique_opens) * 100.0 / NULLIF(SUM(f.sends) - SUM(f.bounces), 0),
          1
        ) AS open_rate_pct
      FROM AGENT_V_FACT_SFMC_PERFORMANCE_TRACKING f
      LEFT JOIN AGENT_V_DIM_SFMC_METADATA_JOB m ON f.comp_key = m.comp_key
      WHERE
        (
          m.email_name NOT ILIKE '%sparkpost%'
          OR m.email_name IS NULL
        )
        AND m.program_or_compaign = 'Campaign'
        AND f.send_date >= DATE_TRUNC('month', DATEADD('month', -1, CURRENT_DATE()))
        AND f.send_date < DATE_TRUNC('month', CURRENT_DATE())
      GROUP BY
        m.email_name,
        f.business_unit
      ORDER BY
        open_rate_pct DESC

  - name: EUROPE_CTR_TREND_6_MONTHS
    question: "Show me the click-through rate trend for the past six months in Europe"
    verified_by: "Analytics Team"
    verified_at: "2026-03-13"
    use_as_onboarding_question: true
    sql: |-
      SELECT
        DATE_TRUNC('month', f.send_date) AS send_month,
        ROUND(
          SUM(f.unique_clicks) * 100.0 / NULLIF(SUM(f.sends) - SUM(f.bounces), 0),
          1
        ) AS click_rate_pct,
        SUM(f.sends) AS total_sends,
        SUM(f.sends) - SUM(f.bounces) AS total_delivered
      FROM AGENT_V_FACT_SFMC_PERFORMANCE_TRACKING f
      LEFT JOIN AGENT_V_DIM_SFMC_METADATA_JOB m ON f.comp_key = m.comp_key
      INNER JOIN AGENT_V_DIM_COUNTRY c ON f.business_unit = c.vc_country_code
      WHERE
        (
          m.email_name NOT ILIKE '%sparkpost%'
          OR m.email_name IS NULL
        )
        AND c.region_name_group = 'EMEA'
        AND f.send_date >= DATEADD('month', -6, DATE_TRUNC('month', CURRENT_DATE()))
        AND f.send_date < DATE_TRUNC('month', CURRENT_DATE())
      GROUP BY
        DATE_TRUNC('month', f.send_date)
      ORDER BY
        send_month ASC

  - name: GERMANY_VS_EUROPE_PERFORMANCE
    question: "How does Germany's email performance compare to the European average?"
    verified_by: "Analytics Team"
    verified_at: "2026-03-13"
    use_as_onboarding_question: true
    sql: |-
      WITH germany AS (
        SELECT
          'Germany' AS market_name,
          ROUND(
            SUM(f.unique_opens) * 100.0 / NULLIF(SUM(f.sends) - SUM(f.bounces), 0),
            1
          ) AS open_rate_pct,
          ROUND(
            SUM(f.unique_clicks) * 100.0 / NULLIF(SUM(f.sends) - SUM(f.bounces), 0),
            1
          ) AS click_rate_pct,
          ROUND(
            SUM(f.unsubscribes) * 100.0 / NULLIF(SUM(f.sends), 0),
            2
          ) AS unsubscribe_rate_pct,
          SUM(f.sends) AS total_sends
        FROM AGENT_V_FACT_SFMC_PERFORMANCE_TRACKING f
        LEFT JOIN AGENT_V_DIM_SFMC_METADATA_JOB m ON f.comp_key = m.comp_key
        WHERE
          (
            m.email_name NOT ILIKE '%sparkpost%'
            OR m.email_name IS NULL
          )
          AND f.business_unit = 'VCDE'
      ),
      europe AS (
        SELECT
          'Europe Average' AS market_name,
          ROUND(
            SUM(f.unique_opens) * 100.0 / NULLIF(SUM(f.sends) - SUM(f.bounces), 0),
            1
          ) AS open_rate_pct,
          ROUND(
            SUM(f.unique_clicks) * 100.0 / NULLIF(SUM(f.sends) - SUM(f.bounces), 0),
            1
          ) AS click_rate_pct,
          ROUND(
            SUM(f.unsubscribes) * 100.0 / NULLIF(SUM(f.sends), 0),
            2
          ) AS unsubscribe_rate_pct,
          SUM(f.sends) AS total_sends
        FROM AGENT_V_FACT_SFMC_PERFORMANCE_TRACKING f
        LEFT JOIN AGENT_V_DIM_SFMC_METADATA_JOB m ON f.comp_key = m.comp_key
        INNER JOIN AGENT_V_DIM_COUNTRY c ON f.business_unit = c.vc_country_code
        WHERE
          (
            m.email_name NOT ILIKE '%sparkpost%'
            OR m.email_name IS NULL
          )
          AND c.region_name_group = 'EMEA'
      )
      SELECT * FROM germany
      UNION ALL
      SELECT * FROM europe

