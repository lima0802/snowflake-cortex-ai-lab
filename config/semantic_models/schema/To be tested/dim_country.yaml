# =============================================================================
# Table: AGENT_V_DIM_COUNTRY
# Role: dimension
# Geographic dimension — 3-level hierarchy:
#   REGION_NAME_GROUP > SALES_AREA > COUNTRY_NAME
# Always join via: f.business_unit = c.vc_country_code
# NEVER use SUB_REGION — deprecated. Always use REGION_NAME_GROUP.
# =============================================================================

table: AGENT_V_DIM_COUNTRY
role: dimension
description: >
  Geographic dimension providing 3-level hierarchy.
  Always join via VC_COUNTRY_CODE = BUSINESS_UNIT.
  Always use REGION_NAME_GROUP for regional filtering — never use SUB_REGION (deprecated).

join_to:
  fact_table: AGENT_V_FACT_SFMC_PERFORMANCE_TRACKING
  join_type: LEFT OUTER
  join_condition: "LEFT JOIN AGENT_V_DIM_COUNTRY c ON f.business_unit = c.vc_country_code"
  notes: "Use for regional analysis (region_name_group, sales_area) and market display (country_name)."

columns:
  dimensions:
    VC_COUNTRY_CODE:
      description: "Two-letter join key matching fact table BUSINESS_UNIT."
      synonyms: [country_code_vc, market_code_vc, vc_code]
    COUNTRY_NAME:
      description: "Full English country name. Use for display in market-level queries."
      synonyms: [country, market_name]
    MARKET_CD:
      description: "Market code. May differ from VC_COUNTRY_CODE for some markets."
    REGION_NAME_GROUP:
      description: >
        PRIMARY regional field. ALWAYS use for regional filtering and grouping.
        NEVER use SUB_REGION. Values: EMEA, APEC, US/CAN, LATAM, Other.
      values:
        EMEA: "Europe, Middle East, Africa"
        APEC: "Asia Pacific — Japan, Korea, Australia, India, Thailand, Malaysia, Singapore, Philippines, Vietnam"
        "US/CAN": "United States and Canada"
        LATAM: "All Latin American countries (Mexico/VCMX, Brazil/VCBR, Argentina, Chile, Colombia, etc.)"
        Other: "Greater China (China/VCCN, Taiwan/VCTW, Hong Kong/VCHK), Global App, Multi-market, Global Major Accounts"
      user_phrases:
        EMEA: ["Europe", "European", "EU", "Middle East", "Africa", "EMEA"]
        APEC: ["Asia", "Asian", "Asia Pacific", "APAC", "Pacific"]
        "US/CAN": ["USA", "US", "United States", "America", "Canada", "North America", "NA"]
        LATAM: ["Latin America", "LATAM", "South America", "Central America", "LatAm", "GILA"]
        Other: ["Other", "Greater China", "Global"]
      gila_note: "GILA specifically refers to VCMX (Mexico) and VCBR (Brazil) only"
    SALES_AREA:
      description: >
        Sub-area within a region. Use ONLY when user asks about a named sub-area (Nordics, DACH, etc.).
        For all other regional queries, use REGION_NAME_GROUP.
      values:
        "Nordics": ["Sweden/VCSE", "Norway/VCNO", "Denmark/VCDK", "Finland/VCFI", "Iceland/VCIS"]
        "Central Europe": ["Germany/VCDE", "Netherlands/VCNL", "Switzerland/VCCH", "Austria/VCAT"]
        "Western Europe": ["France/VCFR", "Spain/VCES", "Italy/VCIT", "Portugal/VCPT", "Belgium/VCBE"]
        "UK & Ireland": ["United Kingdom/VCUK", "Ireland/VCIE"]
        "Eastern Europe": ["Poland", "Greece", "Turkey", "Russia", "South Africa", "other Eastern European markets"]
        "EMEA Importers": ["Smaller EMEA markets"]
        "APEC NSC": ["Japan/VCJP", "Korea/VCKR", "Australia/VCAU", "Thailand/VCTH", "Malaysia/VCMY", "India/VCIN", "Bangladesh"]
        "APEC Importers": ["Singapore", "Philippines", "Vietnam", "New Zealand", "other APEC markets"]
        "USA and Canada": ["United States/VCUS", "Canada/VCCA"]
        "LATAM NSC": ["Mexico/VCMX", "Brazil/VCBR"]
        "LATAM Importers": ["Argentina", "Chile", "Colombia", "other LATAM importers"]
        "Greater China": ["China/VCCN", "Taiwan/VCTW", "Hong Kong/VCHK"]
        "Global App": ["Global application markets"]
        "Multi-market app": ["Multi-market applications"]
        "Global Major Accounts": ["Special global accounts"]
    SUB_REGION:
      description: "DEPRECATED — do not use in queries. Use REGION_NAME_GROUP instead."
      deprecated: true
    COUNTRY_CODE:
      description: "ISO 2-letter country code."

filters:
  emea_region:
    sql: "c.region_name_group = 'EMEA'"
    trigger: ["Europe", "European", "EU", "EMEA", "Middle East", "Africa"]
  apec_region:
    sql: "c.region_name_group = 'APEC'"
    trigger: ["Asia", "Asian", "Asia Pacific", "APAC", "Pacific", "APEC"]
  us_can_region:
    sql: "c.region_name_group = 'US/CAN'"
    trigger: ["USA", "US", "United States", "America", "Canada", "North America", "NA"]
  latam_region:
    sql: "c.region_name_group = 'LATAM'"
    trigger: ["Latin America", "LATAM", "South America", "Central America", "LatAm", "GILA"]
  other_region:
    sql: "c.region_name_group = 'Other'"
    trigger: ["Other", "Greater China", "Global App", "Multi-market"]
  greater_china:
    sql: "c.sales_area = 'Greater China'"
    trigger: ["Greater China", "China region"]
  nordics_salesarea:
    sql: "c.sales_area = 'Nordics'"
    trigger: ["Nordics", "Scandinavia", "Nordic countries"]
  central_europe_salesarea:
    sql: "c.sales_area = 'Central Europe'"
    trigger: ["Central Europe", "DACH"]
  western_europe_salesarea:
    sql: "c.sales_area = 'Western Europe'"
    trigger: ["Western Europe"]
  uk_ireland_salesarea:
    sql: "c.sales_area = 'UK & Ireland'"
    trigger: ["UK and Ireland", "British Isles"]
  eastern_europe_salesarea:
    sql: "c.sales_area = 'Eastern Europe'"
    trigger: ["Eastern Europe"]
  apec_nsc_salesarea:
    sql: "c.sales_area = 'APEC NSC'"
    trigger: ["APEC NSC", "major APEC markets"]
  apec_importers_salesarea:
    sql: "c.sales_area = 'APEC Importers'"
    trigger: ["APEC importers"]
  latam_nsc_salesarea:
    sql: "c.sales_area = 'LATAM NSC'"
    trigger: ["LATAM NSC", "GILA"]
  latam_importers_salesarea:
    sql: "c.sales_area = 'LATAM Importers'"
    trigger: ["LATAM importers"]
  D2C_market:
    sql: "f.business_unit = 'VCUK'"
    trigger: ["D2C", "flipped market", "direct to consumer"]
  non_D2C_market:
    sql: "f.business_unit != 'VCUK'"
    trigger: ["non-D2C", "dealer markets"]
