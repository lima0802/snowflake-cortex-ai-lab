# =============================================================================
# Table: AGENT_CORTEX_SFMC_BENCHMARK_THRESHOLDS
# Role: lookup
# Industry benchmark thresholds — query only when user explicitly asks for
# industry benchmarks. The word "benchmark" alone does NOT trigger this table.
# =============================================================================

table: AGENT_CORTEX_SFMC_BENCHMARK_THRESHOLDS
role: lookup
description: >
  Industry benchmark thresholds for premium automotive email marketing (2024-2025).
  Query this table ONLY when the user explicitly says "industry benchmark",
  "industry standard", "industry average", "what is a good [metric]?", or
  "is this good or bad?" in an industry comparison context.
  The word "benchmark" alone does NOT trigger this table.

join_to:
  fact_table: AGENT_V_FACT_SFMC_PERFORMANCE_TRACKING
  join_type: lookup (compute metrics from fact, then join to threshold ranges)
  join_condition: |
    LEFT JOIN AGENT_CORTEX_SFMC_BENCHMARK_THRESHOLDS b
      ON b.metric_name = '<metric>'
      AND b.email_type = 'all'        -- or 'campaign', 'program', 'newsletter'
      AND b.status != 'info'
      AND (b.min_value IS NULL OR computed_rate >= b.min_value)
      AND (b.max_value IS NULL OR computed_rate < b.max_value)
  notes: "Default: email_type = 'all'; industry = 'premium_automotive'; year_period = '2024-2025'"

columns:
  dimensions:
    BENCHMARK_ID:
      description: "Unique identifier for each benchmark row."
    METRIC_NAME:
      description: "The KPI this row defines a threshold for."
      values: [open_rate, click_rate, ctor, bounce_rate, unsubscribe_rate]
    EMAIL_TYPE:
      description: "Email category this benchmark applies to."
      values: [all, campaign, program, newsletter, service_reminder]
      default_filter: "Use email_type = 'all' unless user specifies a type."
    STATUS:
      description: "Performance level classification."
      values: [critical, warning, good, strong, excellent, info]
    STATUS_LABEL:
      description: "Human-readable label for the status (e.g., 'Good - Premium Benchmark')."
    DESCRIPTION:
      description: "Narrative description of what this threshold means."
    INDUSTRY:
      description: "Industry segment this benchmark applies to."
      default_value: premium_automotive
    YEAR_PERIOD:
      description: "Year range the benchmark was derived from."
      default_value: "2024-2025"
    IS_INVERSE:
      description: "True when lower values are better (e.g., bounce rate, unsubscribe rate)."
    ACTION_REQUIRED:
      description: "Recommended action when this status is triggered."
    SEARCH_CONTENT:
      description: "Text content used for Cortex Search lookups."

  facts:
    MIN_VALUE:
      description: "Lower bound of the threshold range (inclusive). NULL means no lower bound."
    MAX_VALUE:
      description: "Upper bound of the threshold range (exclusive). NULL means no upper bound."

  time_dimensions:
    LAST_UPDATED:
      description: "Date the benchmark data was last refreshed."