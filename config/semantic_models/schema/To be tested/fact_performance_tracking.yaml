# =============================================================================
# Table: AGENT_V_FACT_SFMC_PERFORMANCE_TRACKING
# Role: fact (primary)
# One row per email send job per business unit per date.
# Source for all engagement KPIs: sends, opens, clicks, bounces, unsubscribes.
# Always join AGENT_V_DIM_SFMC_METADATA_JOB (+ sparkpost exclusion).
# Always join AGENT_V_DIM_COUNTRY for regional/market dimensions.
# =============================================================================

table: AGENT_V_FACT_SFMC_PERFORMANCE_TRACKING
role: fact
description: >
  Primary email performance fact table. One row per email send job per business unit per date.
  Source for all engagement KPIs (sends, opens, clicks, bounces, unsubscribes).
  Always join AGENT_V_DIM_SFMC_METADATA_JOB for campaign attributes (and apply sparkpost exclusion).
  Join AGENT_V_DIM_COUNTRY for regional/market dimensions.

columns:
  dimensions:
    COMP_KEY:
      description: "Composite key — join to AGENT_V_DIM_SFMC_METADATA_JOB for campaign metadata."
      synonyms: [composite_key, job_key]
    BUSINESS_UNIT:
      description: >
        Market identifier following 'VC' + country code pattern (e.g., VCUK = UK, VCDE = Germany).
        Join to AGENT_V_DIM_COUNTRY on vc_country_code for country_name and region_name_group.
      synonyms: [bu, market, market_code]
    SEND_ID:
      description: "Unique identifier for the email send job. Used for tracking individual campaign sends."
      synonyms: [email_job, job_id, job_number, send_identifier, send_job]
    SOURCE:
      description: "Data source identifier. Values: sfmc (Salesforce Marketing Cloud), datorama."
      values: [sfmc, datorama]
      synonyms: [data_origin, data_source, origin, source_system]

  facts:
    SENDS:
      description: >
        Total email delivery attempts. NOT successful deliveries —
        use (SENDS - BOUNCES) for delivered count.
        Base metric for bounce rate and unsubscribe rate denominators.
      synonyms: [total sends, email volume, send count, delivery attempts, raw_sends, sends_raw]
      aggregation: SUM

    BOUNCES:
      description: >
        Total bounced emails (undeliverable). Includes hard bounces (invalid address)
        and soft bounces (temporary issues). Bounce rate >2% indicates list quality problems.
      synonyms: [bounce_raw_count, bounces_raw, raw_bounces]
      aggregation: SUM

    OPENS:
      description: >
        Total email opens including multiple opens by the same recipient.
        NOT used for rate calculations — use UNIQUE_OPENS for open rate.
        May include tracking pixel loads triggered by mail clients.
      synonyms: [gross_opens_raw, opens_raw, raw_opens]
      aggregation: SUM

    UNIQUE_OPENS:
      description: >
        Count of unique recipients who opened the email (deduplicated).
        PRIMARY METRIC for open rate: open_rate = UNIQUE_OPENS / (SENDS - BOUNCES).
      synonyms: [unique open count, distinct opens, individual opens, raw_unique_opens]
      aggregation: SUM

    CLICKS:
      description: >
        Total clicks on links including multiple clicks by the same recipient.
        NOT used for rate calculations — use UNIQUE_CLICKS for CTR/CTOR.
      synonyms: [clicks_raw, gross_clicks_raw, raw_clicks]
      aggregation: SUM

    UNIQUE_CLICKS:
      description: >
        Count of unique recipients who clicked (deduplicated).
        PRIMARY METRIC for: CTR = UNIQUE_CLICKS / DELIVERED; CTOR = UNIQUE_CLICKS / UNIQUE_OPENS.
      synonyms: [unique click count, distinct clicks, individual clickers, raw_unique_clicks]
      aggregation: SUM

    UNSUBSCRIBES:
      description: >
        Total recipients who opted out. Key indicator of email fatigue and content relevance.
      synonyms: [opt-outs, unsubscribe count, list churn, raw_unsubscribes, unsubs_raw]
      aggregation: SUM

  time_dimensions:
    SEND_DATE:
      expr: SEND_DATE
      data_type: DATE
      description: "Date the email was sent. Primary date dimension for time-based analysis."
      synonyms: [campaign_date, date, date_sent, delivery_date, email_date, sent_date]

    SEND_MONTH:
      expr: "DATE_TRUNC('MONTH', SEND_DATE)"
      data_type: DATE
      description: "First day of the month for monthly aggregation and trend analysis."
      synonyms: [campaign_month, delivery_month, email_month, month, monthly, send_period_month]

    SEND_QUARTER:
      expr: "DATE_TRUNC('QUARTER', SEND_DATE)"
      data_type: DATE
      description: "First day of the quarter for quarterly aggregation."
      synonyms: [campaign_quarter, quarter, quarterly, send_qtr]

    SEND_YEAR:
      expr: "DATE_TRUNC('YEAR', SEND_DATE)"
      data_type: DATE
      description: "First day of the year for yearly aggregation."
      synonyms: [annual, campaign_year, email_year, yearly]

    YEAR_MONTH:
      expr: "TO_CHAR(SEND_DATE, 'YYYY-MM')"
      data_type: VARCHAR
      description: "Year and month in YYYY-MM format. Use for monthly time series and sorting."
      synonyms: [month_year, monthly_period, period, yyyymm]

    YEAR_MONTH_SHORT:
      expr: "TO_CHAR(SEND_DATE, 'YY-MM')"
      data_type: VARCHAR
      description: "Year and month in YY-MM short format (e.g., 25-03)."
      synonyms: [short_period]

    YEAR_QUARTER:
      expr: "YEAR(SEND_DATE) || '-' || 'Q' || QUARTER(SEND_DATE)"
      data_type: VARCHAR
      description: "Year and quarter in YYYY-Q# format. Use for quarterly time series."
      synonyms: [quarter_year, quarterly_period]

    QUARTER_NAME:
      expr: "'Q' || QUARTER(SEND_DATE)"
      data_type: VARCHAR
      description: "Fiscal quarter label — Q1, Q2, Q3, Q4."
      synonyms: [fiscal_quarter, q1, q2, q3, q4]

    MONTH_NAME:
      expr: "TO_CHAR(SEND_DATE, 'Mon')"
      data_type: VARCHAR
      description: "Abbreviated month name (Jan, Feb, Mar, etc.)."
      synonyms: [month_abbrev, month_short]

    MONTH_NAME_FULL:
      expr: "CASE MONTH(SEND_DATE) WHEN 1 THEN 'January' ... WHEN 12 THEN 'December' END"
      data_type: VARCHAR
      description: "Full month name (January, February, etc.)."
      synonyms: [full_month_name, month_full, month_long]

    MONTH_NUMBER:
      expr: "MONTH(SEND_DATE)"
      data_type: NUMBER
      description: "Month number (1-12). Use for month-based sorting and filtering."
      synonyms: [month_index, month_no]

    YEAR_NUMBER:
      expr: "YEAR(SEND_DATE)"
      data_type: NUMBER
      description: "Four-digit year number. Use for year filtering and grouping."
      synonyms: [calendar_year, year]

    WEEK_NAME:
      expr: "'W' || LPAD(WEEKISO(SEND_DATE)::STRING, 2, '0')"
      data_type: VARCHAR
      description: "Week name with W prefix (W01, W26, W52)."
      synonyms: [week, week_label]

    WEEK_NUMBER:
      expr: "WEEKISO(SEND_DATE)"
      data_type: NUMBER
      description: "ISO week number (1-53)."
      synonyms: [iso_week_number, week_no, week_of_year]

    WEEKDAY_NAME:
      expr: "DAYNAME(SEND_DATE)"
      data_type: VARCHAR
      description: "Day of week name (Mon, Tue, Wed, etc.)."
      synonyms: [day_name, day_of_week, dow_name, weekday]

    WEEKDAY_NUMBER:
      expr: "DAYOFWEEKISO(SEND_DATE)"
      data_type: NUMBER
      description: "Day of week number (1=Monday, 7=Sunday)."
      synonyms: [day_of_week_number, dow]

    HALF_YEAR:
      expr: "CASE WHEN MONTH(SEND_DATE) <= 6 THEN 'H1' ELSE 'H2' END"
      data_type: VARCHAR
      description: "Half-year indicator (H1 = Jan-Jun, H2 = Jul-Dec)."
      synonyms: [first_half, h1, h2, half, second_half, semester]

    IS_WEEKEND:
      expr: "CASE WHEN DAYOFWEEKISO(SEND_DATE) IN (6, 7) THEN 'Weekend' ELSE 'Weekday' END"
      data_type: VARCHAR
      description: "Indicates if send date was a weekend or weekday."
      synonyms: [day_type, weekend, weekend_flag]

    MONTH_DAY:
      expr: "TO_CHAR(SEND_DATE, 'MM-DD')"
      data_type: VARCHAR
      description: "Month and day in MM-DD format. Useful for year-over-year daily comparisons."
      synonyms: [day_month, mm-dd, month_and_day]

    DATE_KEY:
      expr: "TO_CHAR(SEND_DATE, 'YYYYMMDD')"
      data_type: VARCHAR
      description: "Date as string key in YYYYMMDD format. Use for date-based joins and sorting."
      synonyms: [date_id, date_integer]

  computed_metrics:
    # ── Rate metrics (decimal, 3dp — for intermediate calculations)
    OPEN_RATE:
      expr: "ROUND(SUM(UNIQUE_OPENS) / NULLIF(SUM(SENDS) - SUM(BOUNCES), 0), 3)"
      description: "Open rate as decimal (e.g., 0.225). Formula: unique_opens / delivered."
      synonyms: [email_open_rate, open_metric, open_percentage, open_ratio, opening_rate, or]

    CLICK_RATE:
      expr: "ROUND(SUM(UNIQUE_CLICKS) / NULLIF(SUM(SENDS) - SUM(BOUNCES), 0), 3)"
      description: "Click-through rate as decimal. Formula: unique_clicks / delivered."
      synonyms: [click_percentage, click_ratio, click_through_rate, ctr, email_ctr]

    CLICK_TO_OPEN_RATE:
      expr: "ROUND(SUM(UNIQUE_CLICKS) / NULLIF(SUM(UNIQUE_OPENS), 0), 3)"
      description: "CTOR as decimal. PRIMARY ENGAGEMENT METRIC — least affected by Apple MPP."
      synonyms: [click_to_open_ratio, click-to-open_rate, ctor, engagement_rate, open_to_click_rate]

    BOUNCE_RATE:
      expr: "ROUND(SUM(BOUNCES) / NULLIF(SUM(SENDS), 0), 3)"
      description: "Bounce rate as decimal. Formula: bounces / sends."
      synonyms: [bounce_percentage, bounce_ratio, br, delivery_failure_rate, undeliverable_rate]

    UNSUBSCRIBE_RATE:
      expr: "ROUND(SUM(UNSUBSCRIBES) / NULLIF(SUM(SENDS), 0), 3)"
      description: "Unsubscribe rate as decimal. Formula: unsubscribes / sends."
      synonyms: [attrition_rate, churn_rate, opt_out_rate, optout_rate, unsub_rate]

    UNIQUE_CLICK_RATE:
      expr: "ROUND(SUM(UNIQUE_CLICKS) / NULLIF(SUM(SENDS) - SUM(BOUNCES), 0), 3)"
      description: "Alias for CLICK_RATE — kept for backwards compatibility and clarity."
      synonyms: [deduplicated_click_rate, distinct_click_rate, ucr]

    UNIQUE_OPEN_RATE:
      expr: "ROUND(SUM(UNIQUE_OPENS) / NULLIF(SUM(SENDS) - SUM(BOUNCES), 0), 3)"
      description: "Alias for OPEN_RATE — kept for backwards compatibility and clarity."
      synonyms: [deduplicated_open_rate, distinct_open_rate, uor]

    # ── PCT display metrics (percentage, 1dp — for presentation)
    OPEN_RATE_PCT:
      expr: "ROUND(100.0 * SUM(UNIQUE_OPENS) / NULLIF(SUM(SENDS) - SUM(BOUNCES), 0), 1)"
      description: "Open rate as percentage rounded to 1 decimal (e.g., 22.5%). Use for display."
      synonyms: [email_open_percent, open_rate_pct, open_rate_percent, opening_percentage, unique_open_percentage]
      benchmark_2024_2025:
        excellent: ">25%"
        good: "15–25% (Volvo target range)"
        warning: "12–15%"
        critical: "<12%"

    CLICK_RATE_PCT:
      expr: "ROUND(100.0 * SUM(UNIQUE_CLICKS) / NULLIF(SUM(SENDS) - SUM(BOUNCES), 0), 1)"
      description: "Click rate as percentage rounded to 1 decimal (e.g., 2.5%). Use for display."
      synonyms: [click_rate_pct, click_rate_percent, ctr_percent, email_click_percent]
      benchmark_2024_2025:
        strong: ">3%"
        good: "1.5–3%"
        warning: "<1.5%"

    CLICK_TO_OPEN_RATE_PCT:
      expr: "ROUND(100.0 * SUM(UNIQUE_CLICKS) / NULLIF(SUM(UNIQUE_OPENS), 0), 1)"
      description: "CTOR as percentage rounded to 1 decimal (e.g., 15.2%). Use for display."
      synonyms: [click_to_open_percent, ctor_percent, ctor_percentage, engagement_percent]
      benchmark_2024_2025:
        strong: ">18%"
        good: "12–18%"
        warning: "<12%"

    BOUNCE_RATE_PCT:
      expr: "ROUND(100.0 * SUM(BOUNCES) / NULLIF(SUM(SENDS), 0), 1)"
      description: "Bounce rate as percentage rounded to 1 decimal. Use for display."
      synonyms: [bounce_percent, bounce_rate_percent, br_percent, undeliverable_percent]
      benchmark_2024_2025:
        healthy: "<1.5%"
        warning: "1.5–2.5%"
        critical: ">2.5%"

    UNSUBSCRIBE_RATE_PCT:
      expr: "ROUND(100.0 * SUM(UNSUBSCRIBES) / NULLIF(SUM(SENDS), 0), 1)"
      description: "Unsubscribe rate as percentage rounded to 1 decimal. Use for display."
      synonyms: [churn_rate_percent, opt-out_percentage, unsubscribe_percentage, unsubscribe_rate_percent]
      benchmark_2024_2025:
        healthy: "<0.25%"
        warning: "0.25–0.4%"
        critical: ">0.4%"
      note: "Gmail 2024 changes made unsubscribing easier — rates are higher industry-wide than pre-2024"

    # ── Volume aggregates
    TOTAL_SENDS:
      expr: "SUM(SENDS)"
      description: "Total email delivery attempts."
      synonyms: [all_sends, email_volume, emails_sent, send_count, send_volume, total_emails]

    TOTAL_DELIVERED:
      expr: "SUM(SENDS) - SUM(BOUNCES)"
      description: "Net successfully delivered emails (sends minus bounces)."
      synonyms: [delivered_count, delivered_emails, emails_delivered, net_sends, successful_deliveries]

    TOTAL_OPENS:
      expr: "SUM(OPENS)"
      description: "Total gross opens including multiple opens by same recipient."
      synonyms: [all_opens, email_opens, gross_opens, open_count]

    TOTAL_UNIQUE_OPENS:
      expr: "SUM(UNIQUE_OPENS)"
      description: "Total unique recipients who opened emails (deduplicated)."
      synonyms: [distinct_opens, individual_opens, net_opens, unique_open_count, unique_openers]

    TOTAL_CLICKS:
      expr: "SUM(CLICKS)"
      description: "Total gross clicks including multiple clicks by same recipient."
      synonyms: [all_clicks, click_count, click_volume, email_clicks, gross_clicks]

    TOTAL_UNIQUE_CLICKS:
      expr: "SUM(UNIQUE_CLICKS)"
      description: "Total unique recipients who clicked (deduplicated)."
      synonyms: [distinct_clicks, individual_clicks, net_clicks, unique_click_count, unique_clickers]

    TOTAL_BOUNCES:
      expr: "SUM(BOUNCES)"
      description: "Total bounced emails. Monitor for list health assessment."
      synonyms: [bounce_count, bounced_emails, delivery_failures, failed_deliveries, undeliverable_emails]

    TOTAL_UNSUBSCRIBES:
      expr: "SUM(UNSUBSCRIBES)"
      description: "Total opt-outs. Monitor for email fatigue and content relevance."
      synonyms: [churn_count, opt-out_count, opt-outs, optouts, unsubscribe_count]

    # ── Utility metrics
    FIRST_SEND_DATE:
      expr: "MIN(SEND_DATE)"
      description: "Earliest date emails were sent. Use to understand historical data coverage."
      synonyms: [earliest_date, earliest_send, first_campaign_date, initial_send_date, start_date]

    LAST_SEND_DATE:
      expr: "MAX(SEND_DATE)"
      description: "Most recent date emails were sent. Use to check data freshness."
      synonyms: [end_date, final_send_date, last_campaign_date, latest_date, most_recent_date]

    NUM_SEND_DAYS:
      expr: "COUNT(DISTINCT SEND_DATE)"
      description: "Number of distinct days on which emails were sent."
      synonyms: [active_days, active_send_days, campaign_days, days_active, send_days, sending_days]
