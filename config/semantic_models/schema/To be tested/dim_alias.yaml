# =============================================================================
# Table: AGENT_V_DIM_SFMC_ALIAS
# Role: dimension
# Link-level dimension — content block and CTA metadata within email templates.
# Use for block-level click analysis via AGENT_V_FACT_SFMC_PERFORMANCE_BLOCK.
# =============================================================================

table: AGENT_V_DIM_SFMC_ALIAS
role: dimension
description: >
  Link-level dimension providing metadata about individual links within email templates.
  Use for block-level click analysis — which CTAs or content blocks drive the most clicks.

join_to:
  fact_table: AGENT_V_FACT_SFMC_PERFORMANCE_BLOCK
  join_type: LEFT OUTER
  join_condition: "LEFT JOIN AGENT_V_DIM_SFMC_ALIAS a ON b.comp_key = a.comp_key"

columns:
  dimensions:
    ALIAS:
      description: "Cleaned/standardized link alias used for grouping similar links across emails."
      synonyms: [link_alias, normalized_alias]
    ALIAS_RAW:
      description: "Raw link alias as originally defined in the email template."
      synonyms: [raw_alias, original_alias]
    BLOCKPOSITION:
      description: "Position of the content block within the email layout (e.g., 1, 2, 3)."
      synonyms: [block_position, content_position, position]
    BLOCKTYPE:
      description: "Type of content block (e.g., hero, CTA, footer, banner)."
      synonyms: [block_type, content_block_type, content_type]
    LINKTEXT:
      description: "The visible text of the hyperlink as displayed in the email."
      synonyms: [anchor_text, cta_text, link_anchor, link_label, link_text]
    LINKTRACKINGALIAS:
      description: "Tracking alias assigned to the link for analytics attribution."
      synonyms: [link_tracking, tracking_alias]
    LINKTYPE:
      description: "Category of link (e.g., CTA, social, unsubscribe, web_version)."
      synonyms: [link_category, link_classification, link_kind]