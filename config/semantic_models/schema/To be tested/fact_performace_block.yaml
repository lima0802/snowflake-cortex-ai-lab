# =============================================================================
# Table: AGENT_V_FACT_SFMC_PERFORMANCE_BLOCK
# Role: fact
# Block-level click fact — one row per content block per email send.
# Use for questions about which CTAs or content sections drive the most clicks.
# Join AGENT_V_DIM_SFMC_ALIAS on COMP_KEY for block/link metadata.
# =============================================================================

table: AGENT_V_FACT_SFMC_PERFORMANCE_BLOCK
role: fact
description: >
  Block-level click performance. Each row represents click activity on a specific content block
  within an email send. Join to AGENT_V_DIM_SFMC_ALIAS for link/block metadata.
  Use for questions about which content blocks or CTAs drive the most clicks within an email.

join_to:
  fact_table: AGENT_V_FACT_SFMC_PERFORMANCE_TRACKING
  join_type: independent fact (use separately, not joined to the main fact)
  notes: "Join AGENT_V_DIM_SFMC_ALIAS on comp_key for block metadata."

columns:
  dimensions:
    ALIAS:
      description: "Link alias for the content block. Join to AGENT_V_DIM_SFMC_ALIAS for full metadata."
    BUSINESS_UNIT:
      description: "Market identifier (same 'VC' + country code pattern as main fact table)."
    COMP_KEY:
      description: "Join key to AGENT_V_DIM_SFMC_ALIAS and AGENT_V_DIM_SFMC_METADATA_JOB."
    EMAIL_NAME:
      description: "Email name for the send job this block belongs to."

  time_dimensions:
    MIN_EVENTDATE:
      description: "Earliest event date for block clicks in this record."

  facts:
    UNIQUE_BLOCK_CLICKS:
      description: "Number of unique recipients who clicked this content block."
      aggregation: SUM
      synonyms: [block_click_count, block_clicks, block_unique_clicks, content_block_clicks]