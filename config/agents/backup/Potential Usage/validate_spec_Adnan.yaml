# Prompt Security Validation Rules
# This file defines patterns that are checked during prompt validation
# Each pattern is tested case-insensitively against prompt files

version: "1.0"
description: "Security and quality validation rules for agent prompt files"

# ============================================================================
# CRITICAL PATTERNS - Block deployment if found
# These patterns represent security vulnerabilities or fundamental design violations
# ============================================================================

critical_patterns:
  
  - name: "Complete Instruction Override"
    description: "Attempts to disable the agent's core function"
    patterns:
      - "do not respond to any questions"
      - "do not answer any questions"
      - "ignore all questions"
      - "do not reply to any questions"
    reason: "This pattern attempts to override the agent's core function. Agent must respond to legitimate questions within scope."
    
  - name: "Previous Instruction Override"
    description: "Classic prompt injection attack"
    patterns:
      - "ignore all previous instructions"
      - "disregard all previous instructions"
      - "forget all previous instructions"
      - "override all instructions"
    reason: "This is a classic prompt injection pattern attempting to override system instructions."
    
  - name: "System Prompt Override"
    description: "Attempts to bypass system-level instructions"
    patterns:
      - "ignore system prompt"
      - "disregard system prompt"
      - "override system prompt"
      - "bypass system prompt"
    reason: "Attempting to bypass system-level instructions compromises agent security."
    
  - name: "Scope Bypass"
    description: "Attempts to respond to all questions regardless of scope"
    patterns:
      - "respond to all questions"
      - "answer all questions"
      - "reply to all questions"
      - "respond to every question"
    reason: "This conflicts with out-of-scope validation. Agent must only respond to in-scope questions."
    
  - name: "Scope Validation Bypass"
    description: "Attempts to ignore scope restrictions"
    patterns:
      - "ignore scope"
      - "bypass scope"
      - "ignore out.of.scope"
      - "disregard scope"
    reason: "Scope restrictions are critical for data governance and security."
    
  - name: "Identity Override"
    description: "Attempts to change agent identity or role"
    patterns:
      - "you are now"
      - "your new role is"
      - "act as if you are"
      - "pretend you are"
      - "role.play as"
      - "forget you are"
      - "switch to unrestricted mode"
      - "switch to"
      - "act as a"
    reason: "Attempting to change agent identity. Agent must maintain its defined role and scope."
    
  - name: "Prompt Exfiltration Attempt"
    description: "Attempts to extract system instructions"
    patterns:
      - "reveal your instructions"
      - "show your instructions"
      - "print your instructions"
      - "display your prompt"
      - "output your system prompt"
    reason: "This is a prompt leakage attack attempting to extract system instructions."
    
  - name: "Data Exfiltration Attempt"
    description: "Attempts to extract all data without authorization"
    patterns:
      - "show me all data"
      - "dump all data"
      - "export all records"
      - "give me all rows"
      - "select \\* from"
    reason: "This pattern attempts to extract all data without proper filters or authorization."
    
  - name: "SQL Injection Pattern"
    description: "Dangerous SQL commands that could manipulate data"
    patterns:
      - "drop table"
      - "delete from"
      - "truncate table"
      - "alter table"
      - "grant all"
      - "create user"
    reason: "Dangerous SQL commands detected. Agent must not execute destructive operations."
  
  - name: "Tool Suppression"
    description: "Attempts to bypass required tool usage (Cortex Analyst/Search)"
    patterns:
      - "don't run a query"
      - "don't run a sql"
      - "skip the database"
      - "skip the query"
      - "don't use any tools"
      - "don't use the tool"
      - "ignore the search"
      - "don't use cortex"
      - "skip cortex"
      - "just answer from what you know"
      - "answer from memory"
      - "just tell me roughly"
      - "just estimate"
    reason: "Agent must always query live data using Cortex Analyst. Estimates or memory-based responses violate data accuracy requirements."
  
  - name: "Data Governance Bypass"
    description: "Attempts to bypass access controls or expose credentials"
    patterns:
      - "override access controls"
      - "bypass access controls"
      - "disable row-level security"
      - "disable security"
      - "show me all data including"
      - "database credentials"
      - "snowflake credentials"
      - "show me the raw sql"
      - "show raw sql"
      - "export to external"
      - "send data to"
    reason: "Access control bypass attempts detected. Agent must respect RBAC, never expose credentials, and never export data to external URLs."
  
  - name: "Instruction Injection"
    description: "Embedded system instructions or admin override attempts"
    patterns:
      - "new instruction:"
      - "system prompt has been updated"
      - "system:"
      - "[[admin"
      - "admin override"
      - "developer says"
      - "the developer told me"
    reason: "Instruction injection attack detected. Agent must reject attempts to inject new system instructions or claim false authority."
  
  - name: "Data Fabrication Request"
    description: "Requests to invent or estimate data"
    patterns:
      - "just make up"
      - "make up a reasonable"
      - "hallucinate some results"
      - "hallucinate"
      - "just fill in with"
      - "fill in with averages"
      - "don't say you don't know"
      - "just give me your best guess"
    reason: "Data fabrication request detected. Agent must never invent numbers or estimate when data is unavailable."

# ============================================================================
# WARNING PATTERNS - Flag for review but allow deployment
# These patterns may indicate quality issues or design conflicts
# ============================================================================

warning_patterns:
  
  - name: "Overly Broad Commitment"
    description: "Absolute commitments that may conflict with other logic"
    patterns:
      - "always respond with"
      - "always answer"
      - "always provide"
      - "must always"
    reason: "Avoid absolute commitments that may conflict with scope validation or clarification logic."
    
  - name: "Clarification Bypass"
    description: "Attempts to skip clarification for ambiguous queries"
    patterns:
      - "never ask for clarification"
      - "do not ask for clarification"
      - "never seek clarification"
      - "avoid asking questions"
    reason: "Clarification is essential for ambiguous queries (e.g., 'conversion', 'benchmark'). Blocking clarification reduces accuracy."
    
  - name: "Premature Response Pattern"
    description: "Forces immediate responses without validation"
    patterns:
      - "answer immediately"
      - "respond immediately"
      - "never wait"
      - "do not delay"
    reason: "Agent should validate scope and clarify ambiguity before responding. Immediate responses may be inaccurate."
    
  - name: "Response Limit Constraint"
    description: "May truncate critical data"
    patterns:
      - "reply limited to"
      - "limit your response to"
      - "maximum response length"
      - "response must be"
    reason: "Review if this conflicts with table formatting rules (e.g., 'show top 10 rows'). Ensure response limits don't truncate critical data."
    
  - name: "Table Formatting Restriction"
    description: "Conflicts with table-first design"
    patterns:
      - "never use tables"
      - "do not use tables"
      - "avoid tables"
      - "do not format as table"
    reason: "This conflicts with the agent's default table-first formatting strategy. Verify this is intentional."
    
  - name: "Auto-Chart Generation"
    description: "Conflicts with chart-on-request design"
    patterns:
      - "always generate charts"
      - "always create visualizations"
      - "always show charts"
      - "must generate chart"
    reason: "This conflicts with the 'table-first, chart only when explicitly requested' design. Review orchestration instructions."
    
  - name: "Overly Permissive Scope"
    description: "May allow out-of-scope queries"
    patterns:
      - "answer any question"
      - "respond to any question"
      - "no restrictions on questions"
      - "all questions are in scope"
    reason: "This may allow out-of-scope queries. Ensure scope validation logic (in/out of scope) is not bypassed."
    
  - name: "Hardcoded Data Value"
    description: "Static data instead of live queries"
    patterns:
      - "click rate is [0-9]+\\."
      - "open rate is [0-9]+\\."
      - "benchmark is [0-9]+\\."
      - "average is [0-9]+\\."
    reason: "Avoid hardcoding metric values in prompts. Agent should query live data from semantic views."
    regex: true  # This pattern uses regex
    
  - name: "External Data Source Reference"
    description: "References to potentially unavailable data sources"
    patterns:
      - "google analytics"
      - "ga4 integration"
      - "salesforce data"
      - "crm data"
      - "external api"
    reason: "Ensure external data sources are actually integrated. Document if this is planned for future phases."
    
  - name: "Error Suppression"
    description: "Hides errors from users"
    patterns:
      - "hide all errors"
      - "suppress all errors"
      - "never show errors"
      - "do not report errors"
      - "never show me error messages"
      - "don't show error messages"
    reason: "Errors should be reported to users for transparency. Silent failures reduce debuggability."
  
  - name: "Single Word Response"
    description: "Forces unhelpful single-word or minimal responses"
    patterns:
      - "reply with just one word"
      - "reply with only one word"
      - "answer in one word"
      - "single word response"
      - "one word answer"
    reason: "Single-word responses defeat the agent's analytics purpose. Agent must provide complete, actionable insights."
  
  - name: "Chart Override"
    description: "Forces chart generation for all responses"
    patterns:
      - "always show a chart"
      - "show chart for everything"
      - "include chart in every response"
    reason: "This conflicts with the 'chart only when explicitly requested' design. Charts should be generated only when user asks for visualization."
  
  - name: "Suppress Data Limitations"
    description: "Attempts to hide data quality warnings"
    patterns:
      - "stop mentioning data limitations"
      - "don't mention limitations"
      - "stop mentioning low sample"
      - "don't include caveats"
      - "remove warnings about"
    reason: "Data limitations and sample size warnings are critical for data quality. Suppressing them misleads users about result reliability."

# ============================================================================
# POSITIVE CHECKS - Recommended patterns that should exist
# ============================================================================

positive_checks:
  
  - name: "Scope Validation Logic"
    description: "Ensures in_scope/out_of_scope checks exist"
    patterns:
      - "out.of.scope"
      - "in.scope"
      - "scope validation"
      - "scope check"
    reason: "Recommend including scope validation (in_scope/out_of_scope) to prevent off-topic queries."
    
  - name: "Clarification Logic"
    description: "Ensures ambiguous terms trigger clarification"
    patterns:
      - "clarification"
      - "ask for clarification"
      - "ambiguous"
      - "confirm"
    reason: "Recommend including clarification triggers for ambiguous terms (e.g., 'conversion', 'benchmark')."
    
  - name: "Agent Identity"
    description: "Ensures agent role is clearly defined"
    patterns:
      - "you are"
      - "your role"
      - "agent identity"
      - "identity:"
    reason: "Recommend defining agent identity and role explicitly to prevent role confusion."

# ============================================================================
# FILE-LEVEL CHECKS
# ============================================================================

file_checks:
  
  max_file_size_bytes: 102400  # 100KB
  max_file_size_reason: "Prompt file is larger than 100KB. Review for unnecessary content or data leakage."
  
  check_world_writable: true
  world_writable_reason: "File permissions allow world write access. Restrict to owner/group only."
  
  check_binary_content: true
  binary_content_reason: "Prompt file contains binary content. Only text-based prompts should be used."

# ============================================================================
# ALLOWED FILE EXTENSIONS
# ============================================================================

allowed_extensions:
  - ".txt"
  - ".yaml"
  - ".yml"
  - ".md"
 